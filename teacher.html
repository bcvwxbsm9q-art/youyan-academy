<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>讲师风采 - 游雁学院</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/mobile-enhanced.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#667eea',
                        secondary: '#764ba2',
                        dark: '#0f172a',
                        darkgray: '#1f2937'
                    }
                }
            },
            darkMode: 'class'
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-gradient { background-clip: text; -webkit-background-clip: text; color: transparent; background-image: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
            .bg-gradient-primary { background-image: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
            .card-hover { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
            .card-hover:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgba(102, 126, 234, 0.15); }
            .level-senior { background: linear-gradient(135deg, #f59e0b, #d97706); }
            .level-intermediate { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
            .level-junior { background: linear-gradient(135deg, #3b82f6, #2563eb); }
            .level-intern { background: linear-gradient(135deg, #10b981, #059669); }
        }
        html { scrollbar-gutter: stable; }
        body { opacity: 0; animation: pageLoad 0.5s ease forwards; }
        @keyframes pageLoad { to { opacity: 1; } }
        
        /* 讲师卡片样式 */
        .lecturer-card {
            background: white;
            border-radius: 16px;
            padding: 20px 14px 16px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .lecturer-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(102, 126, 234, 0.15);
            border-color: #667eea;
        }
        .lecturer-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 16px;
            overflow: hidden;
            border: 3px solid #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .lecturer-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .lecturer-level {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: white;
            margin-bottom: 12px;
        }
        .lecturer-name {
            font-size: 18px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 4px;
        }
        .lecturer-title {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 12px;
        }
        .lecturer-stats {
            display: flex;
            justify-content: center;
            gap: 16px;
            font-size: 13px;
            color: #6b7280;
        }
        .lecturer-stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .lecturer-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px;
            margin-top: 8px;
            min-height: 22px;
        }
        .lecturer-tag {
            padding: 3px 10px;
            background: #f3f4f6;
            border-radius: 12px;
            font-size: 11px;
            color: #6b7280;
            font-weight: 500;
            white-space: nowrap;
        }
        .lecturer-tag.more {
            background: #f3f4f6;
            color: #9ca3af;
            border-color: #e5e7eb;
        }

        /* ============================================================
         * 讲师详情弹窗 - Premium 样式（命名空间 tc-*）
         * ============================================================ */
        .teacher-modal-container { position: fixed; inset: 0; z-index: 200; }

        .tc-mask {
            position: fixed; inset: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(10px) saturate(140%);
            -webkit-backdrop-filter: blur(10px) saturate(140%);
            display: flex; align-items: flex-start; justify-content: center;
            padding: 56px 16px 24px;
            animation: tc-mask-in 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes tc-mask-in { from { opacity: 0; } to { opacity: 1; } }

        .tc-modal {
            position: relative;
            width: 100%; max-width: 440px;
            max-height: calc(100vh - 80px);
            background: #fff;
            border-radius: 24px;
            box-shadow:
                0 24px 60px -20px rgba(102, 126, 234, 0.35),
                0 12px 32px -12px rgba(118, 75, 162, 0.25),
                0 0 0 1px rgba(255, 255, 255, 0.6) inset;
            display: flex; flex-direction: column;
            overflow: hidden;
            opacity: 0; transform: translateY(24px) scale(0.96);
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .tc-modal.tc-modal-in { opacity: 1; transform: translateY(0) scale(1); }

        /* 暗色模式 */
        .dark .tc-mask { background: rgba(0, 0, 0, 0.7); }
        .dark .tc-modal { background: #1f2937; box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05) inset; }

        /* Hero 区 */
        .tc-hero {
            position: relative;
            padding: 20px 22px 64px;
            background:
                radial-gradient(circle at 20% 0%, rgba(255, 255, 255, 0.18), transparent 60%),
                linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }
        .tc-hero-glow {
            position: absolute; border-radius: 50%; filter: blur(40px); opacity: 0.55; pointer-events: none;
        }
        .tc-hero-glow-1 { top: -40px; right: -30px; width: 160px; height: 160px; background: rgba(255, 255, 255, 0.35); }
        .tc-hero-glow-2 { bottom: -30px; left: 20px; width: 100px; height: 100px; background: rgba(118, 75, 162, 0.6); }

        .tc-hero-title {
            position: relative; z-index: 2;
            color: #fff; font-size: 16px; font-weight: 600; letter-spacing: 0.5px;
            display: inline-flex; align-items: center; gap: 8px;
            padding: 6px 14px; border-radius: 999px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .tc-hero-title::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.8); }

        .tc-close {
            position: absolute; top: 18px; right: 18px;
            width: 32px; height: 32px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
            z-index: 5;
        }
        .tc-close:hover { background: rgba(255, 255, 255, 0.35); transform: rotate(90deg); }

        /* 悬浮头像 */
        .tc-avatar-wrap {
            position: absolute;
            left: 50%; top: 76px;
            transform: translate(-50%, 0);
            z-index: 10;
        }
        .tc-avatar-ring {
            width: 88px; height: 88px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            box-shadow: 0 10px 24px -8px rgba(102, 126, 234, 0.5);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .tc-modal-in .tc-avatar-ring { animation: tc-avatar-pop 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both; }
        @keyframes tc-avatar-pop {
            0% { transform: scale(0.5); opacity: 0; }
            60% { transform: scale(1.08); }
            100% { transform: scale(1); opacity: 1; }
        }
        .tc-avatar-ring.level-senior { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .tc-avatar-ring.level-intermediate { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
        .tc-avatar-ring.level-junior { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .tc-avatar-ring.level-intern { background: linear-gradient(135deg, #10b981, #059669); }

        .tc-avatar {
            width: 100%; height: 100%; border-radius: 50%;
            object-fit: cover; display: block; background: #f3f4f6;
        }

        /* 内容区 */
        .tc-body {
            flex: 1; overflow-y: auto;
            padding: 56px 20px 16px;
        }
        .tc-body::-webkit-scrollbar { width: 6px; }
        .tc-body::-webkit-scrollbar-thumb { background: rgba(102, 126, 234, 0.25); border-radius: 3px; }

        .tc-name-block {
            text-align: center;
            margin-bottom: 18px;
            animation: tc-fade-up 0.5s ease 0.25s both;
        }
        @keyframes tc-fade-up {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .tc-name {
            font-size: 22px; font-weight: 700; color: #1f2937;
            margin: 0 0 8px; letter-spacing: 0.5px;
        }
        .dark .tc-name { color: #f3f4f6; }

        .tc-level-badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 4px 12px; border-radius: 999px;
            color: #fff; font-size: 12px; font-weight: 600;
            box-shadow: 0 4px 10px -3px rgba(0, 0, 0, 0.2);
        }
        .tc-level-badge i { font-size: 10px; }

        /* 指标行 */
        .tc-metric-row {
            display: flex; align-items: center;
            padding: 14px 8px;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-radius: 16px;
            margin-bottom: 18px;
            animation: tc-fade-up 0.5s ease 0.35s both;
        }
        .dark .tc-metric-row { background: linear-gradient(135deg, #111827 0%, #0f172a 100%); }

        .tc-metric { flex: 1; text-align: center; padding: 0 4px; }
        .tc-metric-icon { font-size: 13px; color: #667eea; margin-bottom: 2px; }
        .tc-metric-num {
            font-size: 20px; font-weight: 700; color: #1f2937;
            line-height: 1.2; letter-spacing: -0.5px;
        }
        .dark .tc-metric-num { color: #f9fafb; }
        .tc-metric-label { font-size: 11px; color: #6b7280; margin-top: 2px; }
        .dark .tc-metric-label { color: #9ca3af; }
        .tc-metric-divider { width: 1px; height: 32px; background: #e5e7eb; }
        .dark .tc-metric-divider { background: #374151; }

        .tc-metric-stars { display: flex; align-items: center; justify-content: center; gap: 1px; line-height: 1.2; }
        .tc-metric-stars i { font-size: 11px; }
        .tc-metric-stars i.on { color: #f59e0b; }
        .tc-metric-stars i.off { color: #e5e7eb; }
        .tc-metric-stars .tc-metric-val { font-size: 20px; font-weight: 700; color: #1f2937; margin-left: 4px; }
        .tc-metric-stars .tc-metric-val.muted { color: #9ca3af; font-size: 20px; font-weight: 600; }
        .dark .tc-metric-stars .tc-metric-val { color: #f9fafb; }

        /* Section 通用 */
        .tc-section { margin-bottom: 18px; }
        .tc-section-head {
            display: flex; align-items: center; gap: 8px;
            font-size: 13px; font-weight: 600; color: #374151;
            margin-bottom: 10px;
        }
        .dark .tc-section-head { color: #e5e7eb; }
        .tc-section-head i { color: #667eea; font-size: 13px; }
        .tc-section-extra {
            margin-left: auto; font-size: 11px; color: #9ca3af; font-weight: 500;
            padding: 2px 8px; background: #f3f4f6; border-radius: 999px;
        }
        .dark .tc-section-extra { background: #374151; }

        /* 个人简介卡片 */
        .tc-intro-card {
            position: relative;
            padding: 14px 16px 14px 22px;
            background: linear-gradient(135deg, #f0f4ff 0%, #faf5ff 100%);
            border-radius: 14px;
            border-left: 3px solid #667eea;
            overflow: hidden;
        }
        .dark .tc-intro-card { background: linear-gradient(135deg, rgba(102, 126, 234, 0.15) 0%, rgba(118, 75, 162, 0.15) 100%); }
        .tc-intro-quote {
            position: absolute; top: -4px; left: 6px;
            font-size: 38px; font-weight: 700; line-height: 1;
            color: #667eea; opacity: 0.25;
            font-family: Georgia, serif;
        }
        .tc-intro-text {
            font-size: 13px; line-height: 1.7; color: #4b5563;
            margin: 0; position: relative; z-index: 1;
        }
        .dark .tc-intro-text { color: #d1d5db; }

        /* 专长领域胶囊 */
        .tc-skill-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .tc-skill-chip {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 5px 12px; border-radius: 999px;
            color: #fff; font-size: 12px; font-weight: 500;
            box-shadow: 0 2px 6px -1px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease;
        }
        .tc-skill-chip:hover { transform: translateY(-1px) scale(1.04); }

        /* 课程项 */
        .tc-course-list { display: flex; flex-direction: column; gap: 8px; }
        .tc-course-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px;
            background: #f9fafb;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }
        .dark .tc-course-item { background: #111827; }
        .tc-course-item:hover {
            background: #f3f4f6;
            border-color: #c7d2fe;
            transform: translateX(2px);
        }
        .dark .tc-course-item:hover { background: #1f2937; border-color: #4c1d95; }
        .tc-course-cover { width: 60px; height: 44px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
        .tc-course-meta { flex: 1; min-width: 0; }
        .tc-course-title { font-size: 13px; font-weight: 500; color: #1f2937; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .dark .tc-course-title { color: #f3f4f6; }
        .tc-course-sub { font-size: 11px; color: #6b7280; margin-top: 3px; display: flex; gap: 10px; }
        .dark .tc-course-sub { color: #9ca3af; }
        .tc-course-sub i { margin-right: 3px; }
        .tc-course-arrow { color: #9ca3af; font-size: 14px; flex-shrink: 0; }

        /* 课程空状态 */
        .tc-empty-courses {
            text-align: center; padding: 28px 16px;
            background: #f9fafb; border-radius: 12px;
            border: 1px dashed #e5e7eb;
        }
        .dark .tc-empty-courses { background: #111827; border-color: #374151; }
        .tc-empty-icon {
            width: 48px; height: 48px; margin: 0 auto 8px;
            background: linear-gradient(135deg, #ede9fe 0%, #dbeafe 100%);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #667eea; font-size: 18px;
        }
        .dark .tc-empty-icon { background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2)); }
        .tc-empty-text { font-size: 12px; color: #6b7280; }
        .dark .tc-empty-text { color: #9ca3af; }

        /* 底部关闭按钮 */
        .tc-footer {
            padding: 12px 20px 16px;
            background: linear-gradient(to top, #fff 70%, transparent);
        }
        .dark .tc-footer { background: linear-gradient(to top, #1f2937 70%, transparent); }
        .tc-close-btn {
            width: 100%; padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff; font-size: 14px; font-weight: 600;
            border: none; border-radius: 14px; cursor: pointer;
            box-shadow: 0 8px 20px -8px rgba(102, 126, 234, 0.6);
            transition: all 0.2s ease;
        }
        .tc-close-btn:hover { transform: translateY(-1px); box-shadow: 0 12px 24px -8px rgba(102, 126, 234, 0.7); }
        .tc-close-btn:active { transform: translateY(0); }

        /* 移动端适配 */
        @media (max-width: 480px) {
            .tc-mask { padding: 24px 12px 16px; }
            .tc-modal { max-height: calc(100vh - 40px); border-radius: 20px; }
            .tc-hero { padding: 18px 20px 60px; }
            .tc-avatar-wrap { top: 70px; }
            .tc-avatar-ring { width: 80px; height: 80px; }
            .tc-body { padding: 50px 16px 14px; }
            .tc-name { font-size: 20px; }
            .tc-metric-num { font-size: 18px; }
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-dark text-gray-800 dark:text-gray-200">
    <!-- 顶部导航栏 -->

        <div class="container-responsive">
            <div class="flex justify-between items-center py-3">

    <main class="pt-16 pb-6">
        <!-- 页面标题 -->
        <section class="py-6 md:py-8 bg-gradient-primary text-white">

    <script src="js/data-sync.js"></script>

    <script src="js/auth-modal.js?v=20260704"></script>
    <script src="js/auth-guard.js?v=20260704"></script>
    <script src="js/notification.js?v=20260704"></script>
    <script>
        // 退出登录（使用统一认证模块）
        function handleLogout() {
            AuthGuard.logout();
        }
        
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = 'fixed top-4 right-4 px-6 py-3 rounded-lg text-white font-medium z-50 shadow-lg ' + (type === 'success' ? 'bg-green-500' : 'bg-red-500');
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function openApplyModal() {
            const existing = document.querySelector('.apply-modal-overlay');
            if (existing) existing.remove();
            
            // 获取当前登录用户信息
            const userStr = localStorage.getItem('user') || sessionStorage.getItem('user');
            let currentUser = null;
            if (userStr) {
                try {
                    currentUser = JSON.parse(userStr);
                } catch(e) {}
            }
            
            const modal = document.createElement('div');
            modal.className = 'apply-modal-overlay fixed inset-0 bg-black/50 backdrop-blur-sm z-[100] flex items-center justify-center';
            modal.onclick = function(e) { if (e.target === this) this.remove(); };
            
            modal.innerHTML = `
                <div class="bg-white rounded-2xl w-full max-w-lg max-h-[90vh] flex flex-col shadow-xl m-4 overflow-hidden" onclick="event.stopPropagation()">
                    <div class="bg-gradient-primary px-6 py-4 flex-shrink-0">
                        <h2 class="text-xl font-bold text-white"><i class="fa fa-edit mr-2"></i>申请成为讲师</h2>
                    </div>
                    <div class="flex-1 overflow-y-auto px-6 py-5 space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">姓名 <span class="text-red-500">*</span></label>
                                <input type="text" id="apply-name" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary bg-gray-50" placeholder="请输入您的姓名" ${currentUser ? `value="${currentUser.real_name || currentUser.realName || ''}"` : ''} readonly>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">部门</label>
                                <input type="text" id="apply-dept" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary bg-gray-50" placeholder="如：技术部" ${currentUser ? `value="${currentUser.department || ''}"` : ''} readonly>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">擅长领域 <span class="text-red-500">*</span></label>
                            <div class="flex gap-2 mb-2">
                                <input type="text" id="apply-skill-input" class="flex-1 px-4 py-2 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary" placeholder="输入技能后回车添加">
                            </div>
                            <div id="apply-skills-tags" class="flex flex-wrap gap-2"></div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">授课经验 <span class="text-red-500">*</span></label>
                            <select id="apply-experience" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary">
                                <option value="">请选择授课经验</option>
                                <option value="none">暂无</option>
                                <option value="1-2">1-2次</option>
                                <option value="3-4">3-4次</option>
                                <option value="5+">5次及以上</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">个人简介</label>
                            <textarea id="apply-intro" rows="3" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary" placeholder="简单介绍您的教学经验或专长..."></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">申请原因 <span class="text-red-500">*</span></label>
                            <textarea id="apply-reason" rows="3" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary" placeholder="请说明您申请成为讲师的原因和期望..."></textarea>
                        </div>
                    </div>
                    <div class="px-6 pb-5 pt-2 border-t flex gap-3">
                        <button onclick="this.closest('.apply-modal-overlay').remove()" class="flex-1 py-3 rounded-xl bg-gray-100 text-gray-600 font-medium hover:bg-gray-200 transition">取消</button>
                        <button onclick="submitApply()" class="flex-1 py-3 rounded-xl bg-gradient-primary text-white font-medium hover:opacity-90 transition"><i class="fa fa-paper-plane mr-1"></i>提交申请</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            
            // 技能标签输入
            const skillInput = modal.querySelector('#apply-skill-input');
            applySkills = [];
            skillInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const val = this.value.trim();
                    if (val && !applySkills.includes(val)) {
                        applySkills.push(val);
                        renderSkillTags(applySkills);
                    }
                    this.value = '';
                }
            });
        }
        
        let applySkills = [];
        function renderSkillTags(list) {
            applySkills = list;
            const container = document.getElementById('apply-skills-tags');
            if (!container) return;
            container.innerHTML = list.map(s => `
                <span class="inline-flex items-center gap-1 px-3 py-1 bg-primary/10 text-primary rounded-full text-sm">
                    ${s}
                    <button onclick="this.parentElement.remove(); removeApplySkill('${s.replace(/'/g, "\\'")}')" class="hover:text-red-500">&times;</button>
                </span>
            `).join('');
        }
        function removeApplySkill(s) {
            applySkills = applySkills.filter(x => x !== s);
            renderSkillTags(applySkills);
        }
        
        async function submitApply() {
            const name = document.getElementById('apply-name').value.trim();
            if (!name) { showToast('请输入姓名', 'error'); return; }
            if (applySkills.length === 0) { showToast('请至少添加一个擅长领域', 'error'); return; }
            
            const experience = document.getElementById('apply-experience').value;
            if (!experience) { showToast('请选择授课经验', 'error'); return; }
            
            const reason = document.getElementById('apply-reason').value.trim();
            if (!reason) { showToast('请填写申请原因', 'error'); return; }
            
            const body = {
                name,
                department: document.getElementById('apply-dept').value.trim(),
                skills: applySkills,
                experience,
                intro: document.getElementById('apply-intro').value.trim(),
                reason
            };
            
            try {
                const res = await fetch('/api/lecturer-applications', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (res.ok) {
                    showToast('申请已提交，请等待审核');
                    document.querySelector('.apply-modal-overlay')?.remove();
                } else {
                    showToast('提交失败，请重试', 'error');
                }
            } catch(e) {
                showToast('网络错误，请重试', 'error');
            }
        }
    </script>
</body>
