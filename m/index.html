<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>游雁学院 · 移动端</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#667eea', secondary: '#764ba2' } } } };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/m/css/mobile.css">
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <!-- 顶部导航 -->
    <header class="m-nav">
      <div class="m-nav__left">
        <svg class="m-logo" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
          <defs>
            <linearGradient id="mlogoGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#667eea"/>
              <stop offset="1" stop-color="#764ba2"/>
            </linearGradient>
          </defs>
          <rect x="0" y="0" width="32" height="32" rx="9" fill="url(#mlogoGrad)"/>
          <path d="M16 7 L27 12 L16 17 L5 12 Z" fill="#fff"/>
          <path d="M9.5 13.5 V19.5 C9.5 19.5 12.5 21.6 16 21.6 C19.5 21.6 22.5 19.5 22.5 19.5 V13.5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="27" cy="12" r="1.7" fill="#fff"/>
        </svg>
        <span class="m-nav__title">游雁学院</span>
      </div>
      <div class="m-nav__right">
        <button class="m-nav__pill" onclick="App.openSharePanel()" aria-label="更多">
          <i class="fa-solid fa-ellipsis"></i>
        </button>
        <button class="m-nav__pill" onclick="history.back()" aria-label="关闭">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </header>

    <!-- 品牌头图 -->
    <section class="m-hero">
      <div class="m-hero__hi" id="m-greet">你好</div>
      <div class="m-hero__name" id="m-hero-name">同学</div>
      <div class="m-hero__sub">学习成就更好的自己 · 移动学习随时随地进行</div>
    </section>

    <!-- 轮播 -->
    <section class="m-swiper" id="m-swiper" style="display:none">
      <div class="m-swiper__track" id="m-swiper-track"></div>
      <div class="m-swiper__dots" id="m-swiper-dots"></div>
    </section>

    <!-- 快捷入口 -->
    <section class="m-section">
      <div class="m-quick">
        <a class="m-quick__item" href="/m/training.html">
          <span class="m-quick__ic"><i class="fa-solid fa-calendar-check"></i></span>
          <span class="m-quick__label">培训安排</span>
        </a>
        <a class="m-quick__item" href="/m/course.html">
          <span class="m-quick__ic"><i class="fa-solid fa-book-open"></i></span>
          <span class="m-quick__label">课程学习</span>
        </a>
        <a class="m-quick__item" href="/m/mine.html#cert">
          <span class="m-quick__ic"><i class="fa-solid fa-award"></i></span>
          <span class="m-quick__label">我的证书</span>
        </a>
        <a class="m-quick__item" href="/m/mine.html#notice">
          <span class="m-quick__ic"><i class="fa-solid fa-bell"></i></span>
          <span class="m-quick__label">消息通知</span>
        </a>
      </div>
    </section>

    <!-- 公告滚动条（单行 + 上下翻滚 + 点击跳转，置于精选课程上方） -->
    <div class="m-notice-bar" id="m-notice-bar">
      <div class="m-notice-bar__ic"><i class="fa-solid fa-volume-high"></i></div>
      <div class="m-notice-bar__body">
        <div class="m-notice-bar__track" id="m-notice-track"><span class="m-notice-bar__item">暂无公告</span></div>
      </div>
      <a class="m-notice-bar__more" href="/m/notices.html">全部 <i class="fa-solid fa-chevron-right"></i></a>
    </div>

    <!-- 精选课程 -->
    <div class="m-hd"><div class="m-hd__t">精选课程</div><a class="m-hd__more" href="/m/course.html">查看全部</a></div>
    <div class="m-course-grid" id="m-course-grid"><div class="m-empty"><i class="fa-solid fa-spinner fa-spin"></i>加载中...</div></div>

    <!-- 推荐讲师（最底部） -->
    <div class="m-hd"><div class="m-hd__t">推荐讲师</div></div>
    <div class="m-lec-scroll" id="m-lec-scroll"><div class="m-empty"><i class="fa-solid fa-spinner fa-spin"></i>加载中...</div></div>
  </div>

  <!-- 共享登录弹窗（复用 PC 端 auth-modal.js） -->
  <script src="/js/auth-modal.js?v=20260723m"></script>
  <script src="/m/js/api-client.js"></script>
  <script src="/m/js/common.js"></script>
  <script src="/m/js/scan.js"></script>
  <script>
    // 封面加载失败时的占位图（同品牌紫渐变 + 播放图标），避免只留紫块导致"显示不全"
    var COVER_FALLBACK = "data:image/svg+xml;charset=utf-8," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='400' height='250'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#667eea'/><stop offset='1' stop-color='#764ba2'/></linearGradient></defs><rect width='400' height='250' fill='url(#g)'/><circle cx='200' cy='125' r='34' fill='rgba(255,255,255,0.92)'/><path d='M190 108 L222 125 L190 142 Z' fill='#667eea'/></svg>");

    // 轮播控制
    var swiper = { idx: 0, timer: null, len: 0 };
    function renderSwiper(banners) {
      var track = document.getElementById('m-swiper-track');
      var dots = document.getElementById('m-swiper-dots');
      var box = document.getElementById('m-swiper');
      if (!banners.length) { box.style.display = 'none'; return; }
      box.style.display = 'block';
      swiper.len = banners.length;
      track.innerHTML = banners.map(function (b) {
        return '<div class="m-swiper__slide"><img src="' + App.esc(b.img) + '" alt=""><div class="m-swiper__cap"><b>' +
          App.esc(b.title || '') + '</b><span>' + App.esc(b.description || '') + '</span></div></div>';
      }).join('');
      dots.innerHTML = banners.map(function (_, i) {
        return '<span class="m-swiper__dot' + (i === 0 ? ' is-active' : '') + '"></span>';
      }).join('');
      startSwiper();
    }
    function startSwiper() {
      clearInterval(swiper.timer);
      if (swiper.len <= 1) return;
      swiper.timer = setInterval(function () {
        swiper.idx = (swiper.idx + 1) % swiper.len;
        goSlide(swiper.idx);
      }, 3500);
    }
    function goSlide(i) {
      document.getElementById('m-swiper-track').style.transform = 'translateX(' + (-100 * i) + '%)';
      Array.prototype.forEach.call(document.querySelectorAll('.m-swiper__dot'), function (d, idx) {
        d.classList.toggle('is-active', idx === i);
      });
    }

    function greet() {
      var h = new Date().getHours();
      return h < 6 ? '凌晨好' : h < 12 ? '早上好' : h < 14 ? '中午好' : h < 18 ? '下午好' : '晚上好';
    }

    // 公告滚动条控制
    var noticeTicker = { idx: 0, timer: null, len: 0 };
    function startNoticeTicker(len) {
      var track = document.getElementById('m-notice-track');
      if (!track || len <= 1) return;
      noticeTicker.len = len;
      noticeTicker.idx = 0;
      clearInterval(noticeTicker.timer);
      // 每 3 秒切换下一条
      noticeTicker.timer = setInterval(function () {
        noticeTicker.idx = (noticeTicker.idx + 1) % noticeTicker.len;
        goNoticeSlide(noticeTicker.idx);
      }, 3000);
    }
    function goNoticeSlide(i) {
      var track = document.getElementById('m-notice-track');
      if (!track) return;
      var items = track.querySelectorAll('.m-notice-bar__item');
      if (!items.length) return;
      if (i < 0 || i >= items.length) i = 0;
      // 推入式：整条 track 往上移 i * 22px（每条高度），下一条从底部顶上来
      track.style.transform = 'translateY(-' + (i * 22) + 'px)';
    }

    async function initHome() {
      document.getElementById('m-greet').textContent = greet();
      document.getElementById('m-hero-name').textContent = App.userName();

      // 讲师表（一次加载，供精选课程关联真实头像/姓名，底部讲师横滑复用）
      var lecsAll = [];
      try { lecsAll = (await Api.lecturers() || []); } catch (e) {}
      var lecMap = {};
      lecsAll.forEach(function (l) { lecMap[String(l.id)] = l; });

      // 轮播
      try {
        var banners = (await Api.banners() || []).filter(function (b) { return b && b.img; });
        renderSwiper(banners);
      } catch (e) { /* 忽略 */ }

      // 公告（单行滚动条）
      try {
        var notices = (await Api.notices() || []).filter(function (n) { return n && (n.status === 'published' || n.status === undefined); });
        notices.sort(function (a, b) { return (b.createdAt || '').localeCompare(a.createdAt || ''); });
        var track = document.getElementById('m-notice-track');
        var bar = document.getElementById('m-notice-bar');
        if (!notices.length) {
          track.innerHTML = '<span class="m-notice-bar__item">暂无公告</span>';
          bar.style.display = 'none';
        } else {
          bar.style.display = '';
          track.innerHTML = notices.map(function (n, i) {
            return '<span class="m-notice-bar__item" data-id="' + (n.id || '') + '" data-idx="' + i + '">' + App.esc(n.title || '') + '</span>';
          }).join('');
          // 点击公告 → 跳转到独立的移动端详情页（m/notice.html?id=）
          Array.prototype.forEach.call(track.querySelectorAll('.m-notice-bar__item'), function (el) {
            el.addEventListener('click', function () {
              App.goNotice(el.getAttribute('data-id'));
            });
          });
          // 初始化定位：只显示第一条，其余隐藏（消除空白/重叠）
          goNoticeSlide(0);
          // 上下翻滚动画：超过 1 条时启动定时切换
          if (notices.length > 1) startNoticeTicker(notices.length);
        }
      } catch (e) { /* 忽略 */ }

      // 精选课程 2x2（取前 4 门）
      try {
        var courses = (await Api.courses() || []).filter(function (c) { return c.status === 'published' || c.status === undefined; });
        var grid = document.getElementById('m-course-grid');
        if (!courses.length) {
          grid.innerHTML = '<div class="m-empty"><i class="fa-regular fa-folder-open"></i>暂无课程</div>';
        } else {
          grid.innerHTML = courses.slice(0, 4).map(function (c) {
            var cover = c.cover || '';
            var rating = parseFloat(c.rating) || 0;
            var views = c.views || 0;
            var likes = c.likes || 0;
            // 关联讲师表，取真实头像 + 真实姓名（不再用图标凑数）
            var lm = lecMap[String(c.lecturerId)];
            var av = lm ? (lm.avatar || lm.photo || lm.cover || '') : '';
            var lname = lm ? (lm.name || lm.realName || '讲师') : '讲师';
            var init = App.esc((lname || '?').slice(0, 1));
            var avHtml = av
              ? '<img class="m-lec-mini" src="' + App.esc(av) + '" data-init="' + init + '" alt="' + App.esc(lname) + '">'
              : '<span class="m-lec-mini">' + init + '</span>';
            var coverHtml = cover
              ? '<img class="m-cover-img" src="' + App.esc(cover) + '" alt="' + App.esc(c.title) + '" loading="lazy" onerror="this.src=\'' + COVER_FALLBACK + '\';this.onerror=null;">'
              : '<div class="m-cover-fallback"><i class="fa-solid fa-play-circle"></i></div>';
            return '<a class="m-course" href="/m/player.html?id=' + App.esc(c.id) + '&index=0&returnUrl=' + encodeURIComponent('m/index.html') + '">' +
              '<div class="m-course__cover">' + coverHtml +
                '<span class="m-course__play"><i class="fa-solid fa-play"></i></span></div>' +
              '<div class="m-course__bd">' +
                '<div class="m-course__t">' + App.esc(c.title) + '</div>' +
                '<div class="m-course__lec">' + avHtml + ' <span>' + App.esc(lname) + '</span></div>' +
                '<div class="m-course__meta">' +
                  '<div class="m-course__meta__left">' +
                    '<span><i class="fa-regular fa-eye"></i> ' + views + '</span>' +
                    '<span><i class="fa-regular fa-thumbs-up"></i> ' + likes + '</span>' +
                  '</div>' +
                  '<span class="m-course__meta__rating"><i class="fa-solid fa-star"></i> ' + rating.toFixed(1) + '</span>' +
                '</div>' +
              '</div></a>';
          }).join('');
          // 讲师头像加载失败 → 降级为首字母圆
          Array.prototype.forEach.call(grid.querySelectorAll('img.m-lec-mini'), function (img) {
            img.addEventListener('error', function () {
              var d = document.createElement('span');
              d.className = 'm-lec-mini';
              d.textContent = img.getAttribute('data-init') || '?';
              img.parentNode.replaceChild(d, img);
            });
          });
        }
      } catch (e) {
        document.getElementById('m-course-grid').innerHTML = '<div class="m-empty"><i class="fa-regular fa-circle-xmark"></i>加载失败</div>';
      }

      // 推荐讲师（底部横滑）
      try {
        var lecs = (await Api.lecturers() || []).slice(0, 10);
        var lbox = document.getElementById('m-lec-scroll');
        if (!lecs.length) {
          lbox.innerHTML = '<div class="m-empty"><i class="fa-regular fa-user"></i>暂无讲师</div>';
        } else {
          lbox.innerHTML = lecs.map(function (l) {
            var av = l.avatar || l.photo || l.cover || '';
            var name = l.name || l.realName || '讲师';
            var init = App.esc((name || '?').slice(0, 1));
            var avHtml = av
              ? '<img class="m-lec__av" src="' + App.esc(av) + '" data-init="' + init + '" alt="">'
              : '<div class="m-lec__av">' + init + '</div>';
            return '<div class="m-lec">' + avHtml +
              '<div class="m-lec__name">' + App.esc(name) + '</div>' +
              '<div class="m-lec__role">' + App.esc(l.title || l.position || l.role || '讲师') + '</div></div>';
          }).join('');
          Array.prototype.forEach.call(lbox.querySelectorAll('img.m-lec__av'), function (img) {
            img.addEventListener('error', function () {
              var d = document.createElement('div');
              d.className = 'm-lec__av';
              d.textContent = img.getAttribute('data-init') || '?';
              img.parentNode.replaceChild(d, img);
            });
          });
        }
      } catch (e) {
        document.getElementById('m-lec-scroll').innerHTML = '<div class="m-empty">加载失败</div>';
      }
    }

    App.initPage({ active: 'home', requireAuth: true, onReady: initHome });
  </script>
</body>
</html>
