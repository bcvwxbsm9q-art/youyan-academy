<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>我的 · 游雁学院</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#667eea', secondary: '#764ba2' } } } };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/m/css/mobile.css">
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="m-nav">
      <div class="m-nav__left">
        <svg class="m-logo" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
          <defs>
            <linearGradient id="mlogoGradM" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#667eea"/>
              <stop offset="1" stop-color="#764ba2"/>
            </linearGradient>
          </defs>
          <rect x="0" y="0" width="32" height="32" rx="9" fill="url(#mlogoGradM)"/>
          <path d="M16 7 L27 12 L16 17 L5 12 Z" fill="#fff"/>
          <path d="M9.5 13.5 V19.5 C9.5 19.5 12.5 21.6 16 21.6 C19.5 21.6 22.5 19.5 22.5 19.5 V13.5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="27" cy="12" r="1.7" fill="#fff"/>
        </svg>
        <span class="m-nav__title">我的</span>
      </div>
      <div class="m-nav__right"></div>
    </header>

    <!-- 个人主卡片（玻璃质感渐变大卡） -->
    <section class="m-sec m-sec--hero m-rise">
      <div class="m-profile">
        <button class="m-profile__edit" data-act="profile" aria-label="编辑资料"><i class="fa-solid fa-pen"></i></button>
        <div class="m-profile__top">
          <div class="m-profile__av-wrap" data-act="profile">
            <div class="m-profile__av" id="m-avatar">学</div>
            <span class="m-profile__dot" title="在线"></span>
            <span class="m-profile__edit-badge"><i class="fa-solid fa-camera"></i></span>
          </div>
          <div class="m-profile__info">
            <div class="m-profile__name" id="m-name">学员</div>
            <div class="m-profile__dep" id="m-dep">游雁学院学员</div>
          </div>
        </div>
        <div class="m-profile__welcome"><i class="fa-solid fa-sparkles"></i> <span id="m-welcome">今天也要坚持学习哦</span></div>
      </div>
    </section>

    <!-- 数据统计 -->
    <div class="m-stats m-rise" id="m-stats-row">
      <div class="m-stat" data-act="learn"><div class="m-stat__v" id="st-hours">0</div><div class="m-stat__l">学习时长(h)</div></div>
      <div class="m-stat" data-act="cert"><div class="m-stat__v" id="st-certs">0</div><div class="m-stat__l">获得证书</div></div>
      <div class="m-stat" data-act="exam"><div class="m-stat__v" id="st-exams">0</div><div class="m-stat__l">参与考试</div></div>
      <div class="m-stat" data-act="learn"><div class="m-stat__v" id="st-days">0</div><div class="m-stat__l">学习天数</div></div>
    </div>

    <!-- 学习概览卡 -->
    <section class="m-sec m-rise">
      <div class="m-card m-overview">
        <div class="m-overview__head">
          <div class="m-overview__main">
            <div class="m-overview__t">累计学习时长</div>
            <div class="m-overview__v"><span id="ov-hours">0</span><i>小时</i></div>
            <div class="m-overview__hint">完成课程 <b id="ov-course">0</b> 门 · 连续学习 <b id="ov-streak">0</b> 天</div>
          </div>
          <div class="m-overview__ring" id="ov-ring"><span id="ov-pct">0%</span></div>
        </div>
        <div class="m-overview__week" id="ov-week"></div>
        <div class="m-overview__weeklabel">最近 7 天学习打卡</div>
      </div>
    </section>

    <!-- 学习成就（横滑徽章墙，带解锁态） -->
    <div class="m-hd m-rise"><div class="m-hd__t"><i class="fa-solid fa-trophy"></i> 学习成就</div><span class="m-hd__more" id="m-ach-more">0/0</span></div>
    <div class="m-ach-scroll m-rise" id="m-ach-scroll"></div>

    <!-- 我的学习 -->
    <div class="m-hd m-rise"><div class="m-hd__t"><i class="fa-solid fa-graduation-cap"></i> 我的学习</div></div>
    <div class="m-menu-group m-rise">
      <div class="m-menu-row" data-act="cert">
        <div class="m-menu-row__ic" style="background:linear-gradient(135deg,#f59e0b,#d97706)"><i class="fa-solid fa-certificate"></i></div>
        <div class="m-menu-row__bd"><div class="m-menu-row__t">我的证书</div><div class="m-menu-row__s">查看与分享你的荣誉</div></div>
        <i class="m-menu-row__arrow fa-solid fa-chevron-right"></i>
      </div>
      <div class="m-menu-row" data-act="exam">
        <div class="m-menu-row__ic" style="background:linear-gradient(135deg,#3b82f6,#2563eb)"><i class="fa-solid fa-file-pen"></i></div>
        <div class="m-menu-row__bd"><div class="m-menu-row__t">考试记录</div><div class="m-menu-row__s">查看成绩与作答详情</div></div>
        <i class="m-menu-row__arrow fa-solid fa-chevron-right"></i>
      </div>
      <div class="m-menu-row" data-act="learn">
        <div class="m-menu-row__ic" style="background:linear-gradient(135deg,#10b981,#059669)"><i class="fa-solid fa-chart-line"></i></div>
        <div class="m-menu-row__bd"><div class="m-menu-row__t">学习记录</div><div class="m-menu-row__s">学时 / 课程 / 互动数据</div></div>
        <i class="m-menu-row__arrow fa-solid fa-chevron-right"></i>
      </div>
      <div class="m-menu-row" data-act="notice">
        <div class="m-menu-row__ic" style="background:linear-gradient(135deg,#8b5cf6,#7c3aed)"><i class="fa-solid fa-bell"></i></div>
        <div class="m-menu-row__bd"><div class="m-menu-row__t">消息通知</div><div class="m-menu-row__s" id="m-notice-sub">系统提醒与公告</div></div>
        <span class="m-menu-row__badge" id="m-notice-badge" hidden>0</span>
        <i class="m-menu-row__arrow fa-solid fa-chevron-right"></i>
      </div>
    </div>

    <!-- 账号设置 -->
    <div class="m-hd m-rise"><div class="m-hd__t"><i class="fa-solid fa-gear"></i> 账号设置</div></div>
    <div class="m-menu-group m-rise">
      <div class="m-menu-row" data-act="profile">
        <div class="m-menu-row__ic" style="background:linear-gradient(135deg,#64748b,#475569)"><i class="fa-solid fa-user-pen"></i></div>
        <div class="m-menu-row__bd"><div class="m-menu-row__t">个人资料</div><div class="m-menu-row__s">姓名 / 部门 / 联系方式</div></div>
        <i class="m-menu-row__arrow fa-solid fa-chevron-right"></i>
      </div>
      <div class="m-menu-row" data-act="logout">
        <div class="m-menu-row__ic" style="background:#fef2f2;color:#ef4444"><i class="fa-solid fa-right-from-bracket"></i></div>
        <div class="m-menu-row__bd"><div class="m-menu-row__t" style="color:#ef4444">退出登录</div></div>
        <i class="m-menu-row__arrow fa-solid fa-chevron-right" style="color:#ef4444"></i>
      </div>
    </div>
  </div>

  <script src="/js/auth-modal.js?v=20260723m"></script>
  <script src="/m/js/api-client.js"></script>
  <script src="/m/js/common.js"></script>
  <script src="/m/js/scan.js"></script>
  <script>
    function avatarText(name) { return name ? name.charAt(0) : '学'; }

    function pad2(n) { return n < 10 ? '0' + n : '' + n; }
    function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
    function calcStreak(dates) {
      if (!dates || !dates.length) return 0;
      var set = {}; dates.forEach(function (d) { set[d] = 1; });
      var d = new Date(); d.setHours(0, 0, 0, 0);
      if (!set[ymd(d)]) d.setDate(d.getDate() - 1); // 今天还没学，从昨天起算连续
      var n = 0;
      while (set[ymd(d)]) { n++; d.setDate(d.getDate() - 1); }
      return n;
    }

    function animateValue(o) {
      var el = o.el || null, to = o.to || 0, dur = o.dur || 850, fmt = o.fmt, onFrame = o.onFrame;
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      function done(v) { if (el) el.textContent = fmt ? fmt(v) : v; if (onFrame) onFrame(v); }
      if (reduce || to === 0) { done(to); return; }
      var start = null;
      function step(ts) {
        if (start === null) start = ts;
        var p = Math.min((ts - start) / dur, 1);
        var e = 1 - Math.pow(1 - p, 3);
        done(Math.round(to * e));
        if (p < 1) requestAnimationFrame(step);
        else done(to);
      }
      requestAnimationFrame(step);
    }

    async function initMine() {
      var u = App.user() || {};
      var name = App.userName();
      document.getElementById('m-name').textContent = name;
      document.getElementById('m-dep').textContent = [u.department, u.position].filter(Boolean).join(' · ') || '游雁学院学员';

      // 头像
      var av = document.getElementById('m-avatar');
      if (u.avatar) { av.outerHTML = '<img class="m-profile__av" id="m-avatar" src="' + App.esc(u.avatar) + '">'; }
      else { av.textContent = avatarText(name); }

      // 数据
      var certs = [], exams = [];
      try { certs = await Api.certificates() || []; } catch (e) {}
      try { exams = await Api.examRecords() || []; } catch (e) {}

      var certCount = certs.length;
      var examCount = exams.length;
      var passCount = exams.filter(function (r) { return r.passed || r.isPassed; }).length;

      // 学习数据
      var key = 'user_learning_' + App.userId();
      var ld = {};
      try { ld = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) {}
      var hours = Math.floor((ld.totalSeconds || (ld.totalHours || 0) * 3600) / 3600) || (ld.totalHours || 0);
      var completed = (ld.completedCourses || []).length;
      var studyDays = (ld.studyDates || []).length;

      // 统计数字（count-up 动效）
      animateValue({ el: document.getElementById('st-hours'), to: hours });
      animateValue({ el: document.getElementById('st-certs'), to: certCount });
      animateValue({ el: document.getElementById('st-exams'), to: examCount });
      animateValue({ el: document.getElementById('st-days'), to: studyDays });

      // 学习概览卡
      var streak = calcStreak(ld.studyDates);
      var now = new Date();
      var ym = now.getFullYear() + '-' + pad2(now.getMonth() + 1);
      var daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      var monthStudied = (ld.studyDates || []).filter(function (d) { return d && d.indexOf(ym) === 0; }).length;
      var pct = daysInMonth ? Math.round(monthStudied / daysInMonth * 100) : 0;

      animateValue({ el: document.getElementById('ov-hours'), to: hours });
      animateValue({ el: document.getElementById('ov-course'), to: completed });
      animateValue({ el: document.getElementById('ov-streak'), to: streak });
      var ring = document.getElementById('ov-ring');
      animateValue({ el: document.getElementById('ov-pct'), to: pct, fmt: function (v) { return v + '%'; }, onFrame: function (v) { ring.style.setProperty('--p', v + '%'); } });

      // 最近 7 天学习打卡
      var week = document.getElementById('ov-week');
      var whtml = '';
      for (var i = 6; i >= 0; i--) {
        var d = new Date(now); d.setDate(now.getDate() - i);
        var on = (ld.studyDates || []).indexOf(ymd(d)) >= 0;
        whtml += '<div class="m-wbar' + (on ? ' is-on' : '') + '"><div class="m-wbar__col"></div><div class="m-wbar__d">' + d.getDate() + '</div></div>';
      }
      week.innerHTML = whtml;

      // 欢迎语
      document.getElementById('m-welcome').textContent = name + '，今天也要坚持学习哦';

      // 未读消息角标
      try {
        var notifs = await Api.notifications() || [];
        var unread = notifs.filter(function (n) { return !n.read; }).length;
        if (unread > 0) {
          var badge = document.getElementById('m-notice-badge');
          badge.textContent = unread > 99 ? '99+' : unread;
          badge.hidden = false;
          document.getElementById('m-notice-sub').textContent = unread + ' 条未读消息';
        }
      } catch (e) {}

      // 学习成就（横滑徽章墙，带解锁态）
      var achievements = [
        { key: 'firstCourse', name: '初出茅庐', icon: 'fa-seedling', color: '#10b981', desc: '完成你的第一门课程', ok: completed >= 1 },
        { key: 'firstCert', name: '持证上岗', icon: 'fa-certificate', color: '#f59e0b', desc: '获得第一张培训证书', ok: certCount >= 1 },
        { key: 'streak7', name: '坚持不懈', icon: 'fa-fire', color: '#ef4444', desc: '连续学习满 7 天', ok: streak >= 7 },
        { key: 'hours10', name: '学有所成', icon: 'fa-clock', color: '#8b5cf6', desc: '累计学习满 10 小时', ok: hours >= 10 },
        { key: 'courses5', name: '博学多才', icon: 'fa-graduation-cap', color: '#3b82f6', desc: '累计完成 5 门课程', ok: completed >= 5 },
        { key: 'fullMonth', name: '全勤标兵', icon: 'fa-calendar-check', color: '#0891b2', desc: '当月学习全勤（每天打卡）', ok: daysInMonth > 1 && monthStudied >= daysInMonth }
      ];
      var achHtml = achievements.map(function (a) {
        var bg = a.ok ? 'background:linear-gradient(135deg,' + a.color + ',' + a.color + 'cc);' : '';
        var badge = '<div class="m-ach__badge" style="' + bg + '"><i class="fa-solid ' + a.icon + '"></i>' +
          (a.ok ? '' : '<span class="m-ach__lock"><i class="fa-solid fa-lock"></i></span>') + '</div>';
        return '<div class="m-ach' + (a.ok ? '' : ' is-locked') + '" data-ach="' + a.key + '">' + badge + '<div class="m-ach__name">' + a.name + '</div></div>';
      }).join('');
      document.getElementById('m-ach-scroll').innerHTML = achHtml;
      var achUnlocked = achievements.filter(function (a) { return a.ok; }).length;
      document.getElementById('m-ach-more').textContent = achUnlocked + '/' + achievements.length;
      document.querySelectorAll('#m-ach-scroll .m-ach').forEach(function (el) {
        el.addEventListener('click', function () {
          var a = null;
          for (var k = 0; k < achievements.length; k++) { if (achievements[k].key === el.getAttribute('data-ach')) { a = achievements[k]; break; } }
          if (!a) return;
          var html = '<div class="m-sheet__hd"><div class="m-sheet__title">学习成就</div></div><div class="m-sheet__body">' +
            '<div style="text-align:center;padding:10px 0 16px">' +
            '<div style="width:84px;height:84px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;' +
            (a.ok ? 'background:linear-gradient(135deg,' + a.color + ',' + a.color + 'cc)' : 'background:#e9ebf1;color:#9aa0b0') + '"><i class="fa-solid ' + a.icon + '"></i></div>' +
            '<div style="font-size:17px;font-weight:800;color:#1f2330">' + a.name + '</div>' +
            '<div style="font-size:13px;color:#5b6172;margin-top:6px">' + a.desc + '</div>' +
            '<div style="margin-top:14px;font-size:13px;font-weight:700;color:' + (a.ok ? '#059669' : '#9aa0b0') + '">' +
            (a.ok ? '<i class="fa-solid fa-check-circle"></i> 已解锁' : '<i class="fa-solid fa-lock"></i> 未解锁') + '</div>' +
            '</div></div>';
          App.openSheet(html);
        });
      });

      // 菜单事件
      document.querySelectorAll('[data-act]').forEach(function (el) {
        el.addEventListener('click', function () {
          var a = el.getAttribute('data-act');
          if (!a) return;
          if (a === 'logout') return App.logout();
          ({ cert: openCert, exam: openExam, learn: openLearn, streak: openLearn, notice: openNotice, hours: openLearn, profile: openProfile })[a]();
        });
      });

      // 深链
      var h = location.hash.replace('#', '');
      if (h === 'cert') setTimeout(openCert, 200);
      else if (h === 'notice') setTimeout(openNotice, 200);

      // 入场动画依次延迟
      document.querySelectorAll('.m-rise').forEach(function (el, i) {
        el.style.animationDelay = (i * 0.07) + 's';
      });
    }

    /* ========== 各弹层功能（复用原有逻辑，UI升级） ========== */

    async function openCert() {
      App.showLoading();
      try {
        var list = await Api.certificates() || [];
        App.hideLoading();
        var html = '<div class="m-sheet__hd"><div class="m-sheet__title">我的证书</div></div><div class="m-sheet__body">';
        if (!list.length) html += '<div class="m-empty"><i class="fa-regular fa-award"></i>暂无证书<br><span style="font-size:12px">完成培训课程后即可获得证书</span></div>';
        else html += list.map(function (c) {
          var img = c.imageUrl ? '<img src="' + App.esc(c.imageUrl) + '" style="width:100%;border-radius:12px">' :
            '<div style="height:120px;border-radius:12px;background:var(--brand-grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px">' + App.esc(c.title || '证书') + '</div>';
          return '<div class="m-cert"><div style="padding:8px">' + img + '</div>' +
            '<div class="m-cert__bd"><div class="m-cert__t">' + App.esc(c.title || '培训证书') + '</div>' +
            '<div class="m-cert__s">颁发：' + App.fmtDate(c.issuedAt || c.createdAt) + '</div></div></div>';
        }).join('');
        html += '</div>';
        App.openSheet(html);
      } catch (e) { App.hideLoading(); App.toast('证书加载失败', 'error'); }
    }

    async function openExam() {
      App.showLoading();
      try {
        var list = await Api.examRecords() || [];
        App.hideLoading();
        var html = '<div class="m-sheet__hd"><div class="m-sheet__title">考试记录</div></div><div class="m-sheet__body">';
        if (!list.length) html += '<div class="m-empty"><i class="fa-regular fa-file-pen"></i>暂无考试记录</div>';
        else html += list.slice().reverse().map(function (r) {
          var title = r.examName || r.title || ('考试 #' + r.examId);
          var score = (r.score != null) ? r.score : '-';
          var pass = r.passed || r.isPassed;
          var when = App.fmtDateTime(r.submittedAt || r.createdAt || r.time);
          var badge = pass ? '<span class="m-badge m-badge--signin">及格</span>' : '<span class="m-badge m-badge--exam">未及格</span>';
          return '<div class="m-row"><div class="m-row__ic"><i class="fa-solid fa-file-pen"></i></div>' +
            '<div class="m-row__bd"><div class="m-row__t" style="font-size:13.5px">' + App.esc(title) + '</div>' +
            '<div class="m-row__s">得分 ' + score + ' · ' + when + '</div></div>' + badge + '</div>';
        }).join('');
        html += '</div>';
        App.openSheet(html);
      } catch (e) { App.hideLoading(); App.toast('记录加载失败', 'error'); }
    }

    function openLearn() {
      var key = 'user_learning_' + App.userId();
      var ld = {};
      try { ld = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) {}
      var hours = Math.floor((ld.totalSeconds || (ld.totalHours || 0) * 3600) / 3600);
      var completed = (ld.completedCourses || []).length;
      var days = (ld.studyDates || []).length;
      var html = '<div class="m-sheet__hd"><div class="m-sheet__title">学习记录</div></div><div class="m-sheet__body">' +
        '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px">' +
          '<div class="m-stat" style="margin:0"><div class="m-stat__v">' + hours + '</div><div class="m-stat__l">累计学时(h)</div></div>' +
          '<div class="m-stat" style="margin:0"><div class="m-stat__v">' + completed + '</div><div class="m-stat__l">完成课程</div></div>' +
          '<div class="m-stat" style="margin:0"><div class="m-stat__v">' + days + '</div><div class="m-stat__l">学习天数</div></div>' +
          '<div class="m-stat" style="margin:0"><div class="m-stat__v">' + (ld.ratings || 0) + '</div><div class="m-stat__l">好评数</div></div>' +
        '</div>' +
        '<div class="m-row"><div class="m-row__ic"><i class="fa-solid fa-share"></i></div><div class="m-row__bd"><div class="m-row__t" style="font-size:13.5px">分享次数</div></div><span class="m-row__s">' + (ld.shares || 0) + '</span></div>' +
        '<div class="m-row"><div class="m-row__ic"><i class="fa-solid fa-heart"></i></div><div class="m-row__bd"><div class="m-row__t" style="font-size:13.5px">点赞次数</div></div><span class="m-row__s">' + (ld.likes || 0) + '</span></div>' +
        '</div>';
      App.openSheet(html);
    }

    async function openNotice() {
      App.showLoading();
      try {
        var list = await Api.notifications() || [];
        App.hideLoading();
        var html = '<div class="m-sheet__hd"><div class="m-sheet__title">消息通知</div></div><div class="m-sheet__body">';
        if (!list.length) html += '<div class="m-empty"><i class="fa-regular fa-bell"></i>暂无消息</div>';
        else html += list.slice().reverse().map(function (n) {
          var unread = !n.read;
          return '<div class="m-notice" data-id="' + n.id + '" style="cursor:pointer">' +
            '<div class="m-notice__ic"><i class="fa-solid fa-bell' + (unread ? '' : '') + '"></i></div>' +
            '<div class="m-notice__bd"><div class="m-notice__t">' + App.esc(n.title) + (unread ? ' <span class="m-badge m-badge--exam">未读</span>' : '') + '</div>' +
            '<div class="m-notice__d">' + App.esc(n.content ? n.content.replace(/<[^>]+>/g, '').slice(0, 40) : '') + '</div></div></div>';
        }).join('');
        html += '</div>';
        App.openSheet(html);
        document.querySelectorAll('#m-sheet-body .m-notice[data-id]').forEach(function (el) {
          el.addEventListener('click', async function () {
            var id = el.getAttribute('id') ? el.getAttribute('id').replace('notice-','') : el.getAttribute('data-id');
            try { await Api.markRead(el.getAttribute('data-id')); } catch (e) {}
            el.querySelector('.m-badge') && el.querySelector('.m-badge').remove();
          });
        });
      } catch (e) { App.hideLoading(); App.toast('消息加载失败', 'error'); }
    }

    function openProfile() {
      var u = App.user() || {};
      var html = '<div class="m-sheet__hd"><div class="m-sheet__title">个人资料</div></div><div class="m-sheet__body">' +
        '<label class="m-label">姓名</label><input class="m-input" id="pf-name" value="' + App.esc(u.realName || u.real_name || u.username || '') + '" style="margin-bottom:12px">' +
        '<label class="m-label">部门</label><input class="m-input" id="pf-dep" value="' + App.esc(u.department || '') + '" style="margin-bottom:12px">' +
        '<label class="m-label">职位</label><input class="m-input" id="pf-pos" value="' + App.esc(u.position || '') + '" style="margin-bottom:12px">' +
        '<label class="m-label">手机号</label><input class="m-input" id="pf-phone" value="' + App.esc(u.phone || '') + '" style="margin-bottom:16px">' +
        '<button class="m-btn m-btn--block" id="pf-save">保存</button></div>';
      App.openSheet(html);
      document.getElementById('pf-save').addEventListener('click', saveProfile);
    }

    async function saveProfile() {
      var payload = {
        realName: document.getElementById('pf-name').value.trim(),
        department: document.getElementById('pf-dep').value.trim(),
        position: document.getElementById('pf-pos').value.trim(),
        phone: document.getElementById('pf-phone').value.trim()
      };
      App.showLoading('保存中...');
      try {
        var r = await Api.profileUpdate(payload);
        var u = App.user() || {};
        Object.assign(u, payload);
        try { localStorage.setItem('user', JSON.stringify(u)); sessionStorage.setItem('user', JSON.stringify(u)); } catch (e) {}
        App.hideLoading(); App.toast('资料已保存'); App.closeSheet(); initMine();
      } catch (e) { App.hideLoading(); App.toast(e.message || '保存失败', 'error'); }
    }

    App.initPage({ active: 'mine', requireAuth: true, onReady: initMine });
  </script>
</body>
</html>
