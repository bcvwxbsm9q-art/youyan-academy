    function avatarText(name) { return name ? name.charAt(0) : '学'; }
    function pad2(n) { return n < 10 ? '0' + n : '' + n; }
    function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
    function fmtDateTimeShort(s) {
      if (!s) return '';
      var d = new Date(s); if (isNaN(d)) return '';
      return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    }
    function calcStreak(dates) {
      if (!dates || !dates.length) return 0;
      var set = {}; dates.forEach(function (d) { set[d] = 1; });
      var d = new Date(); d.setHours(0, 0, 0, 0);
      if (!set[ymd(d)]) d.setDate(d.getDate() - 1);
      var n = 0;
      while (set[ymd(d)]) { n++; d.setDate(d.getDate() - 1); }
      return n;
    }

    /* 等级体系 / XP 计算已统一收敛到 window.XP（js/xp-system.js），本文件不再重复定义 */



    function animateValue(o) {
      var el = o.el || null, to = o.to || 0, dur = o.dur || 850, fmt = o.fmt, onFrame = o.onFrame;
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      function done(v) { if (el) el.textContent = fmt ? fmt(v) : v; if (onFrame) onFrame(v); }
      if (reduce || to === 0) { done(to); return; }
      var start = null;
      function step(ts) {
        if (start === null) start = ts;
        var p = Math.min((ts - start) / dur, 1);
        var e = 1 - Math.pow(1 - p, 3);
        done(Math.round(to * e));
        if (p < 1) requestAnimationFrame(step);
        else done(to);
      }
      requestAnimationFrame(step);
    }

    async function initMine() {
      var u = App.user() || {};
      var name = App.userName();
      if (!name || name === 'admin') name = '学员';

      // ===== 渲染：个人信息区 =====
      document.getElementById('m-name').textContent = name;
      document.getElementById('m-dep').textContent = [u.department, u.position].filter(Boolean).join(' · ') || '游雁学院学员';
      document.getElementById('m-role').textContent = (u.roleName === 'admin' || u.role === 'admin') ? '管理员' : (u.roleName || u.role || '学员');
      var av = document.getElementById('m-avatar');
      if (u.avatar) { av.outerHTML = '<img class="m-ph__av" id="m-avatar" src="' + App.esc(u.avatar) + '">'; }
      else { av.textContent = avatarText(name); }

      // 数据（均为服务端真实数据）
      // 各接口返回结构不统一（data / examRecords / list），统一归一化为数组，避免 .filter/.length 在非数组上抛错中断整页
      function toArr(x) {
        if (Array.isArray(x)) return x;
        if (x && Array.isArray(x.data)) return x.data;
        if (x && Array.isArray(x.examRecords)) return x.examRecords;
        if (x && Array.isArray(x.list)) return x.list;
        if (x && Array.isArray(x.certificates)) return x.certificates;
        if (x && Array.isArray(x.trainings)) return x.trainings;
        return [];
      }
      var certs = [], exams = [], trains = [];
      try { certs = toArr(await Api.certificates()); } catch (e) {}
      try { exams = toArr(await Api.examRecords()); } catch (e) {}
      try { trains = toArr(await Api.userTrainings()); } catch (e) {}
      var certCount = certs.length;
      var examCount = exams.length;
      var trainingsCount = trains.length;

      // 服务端学习统计（单一权威来源；旧服务器若无此接口则回退到本地 localStorage）
      // 注意：Api.get 已自动拆包 json.data，返回的 lsRes 本身就是数据对象，不可再取 .data
      var srvStats = null;
      try {
        var lsRes = await Api.get('/user/learning-stats');
        if (lsRes) srvStats = lsRes;
      } catch (e) { srvStats = null; }

      // 学习数据
      var key = 'user_learning_' + App.userId();
      var ld = {};
      try { ld = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) {}
      var hours = Math.floor((ld.totalSeconds || (ld.totalHours || 0) * 3600) / 3600) || (ld.totalHours || 0);
      var completed = (ld.completedCourses || []).length;
      var studyDays = (ld.studyDates || []).length;

      // ===== 42 枚成就徽章（条件与 PC 端 center.html / 服务端 calculateBadgeCount 完全一致） =====
      var now = new Date();
      var ym = now.getFullYear() + '-' + pad2(now.getMonth() + 1);
      var daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      var streak = calcStreak(ld.studyDates);
      var monthStudied = (ld.studyDates || []).filter(function (d) { return d && d.indexOf(ym) === 0; }).length;

      // 若服务端统计可用，以服务端为准（覆盖本地估算，保证与 PC/后台一致）
      if (srvStats) {
        if (srvStats.certificateCount != null) certCount = srvStats.certificateCount;
        // 注意：不要对 hours 取整，服务端按 Math.floor(totalHours*5) 计算（totalHours 为1位小数），取整会少算 XP
        if (srvStats.hours != null) hours = srvStats.hours;
        if (srvStats.completed != null) completed = srvStats.completed;
        if (srvStats.streak != null) streak = srvStats.streak;
      }

      // 考试统计（与服务端规则一致）
      var examValid = exams.filter(function (r) { return r.status === 'completed' || r.passed === true || r.isPassed === true; }).length;
      var examPassed = exams.filter(function (r) { return r.passed === true || r.isPassed === true; }).length;
      var perfectScore = exams.some(function (r) { return Number(r.score) === 100; });

      // 注册天数（PC 端里程碑徽章口径）
      var u0 = App.user() || {};
      var registerDays = 0;
      if (u0.createdAt) { var reg = new Date(u0.createdAt); if (!isNaN(reg)) registerDays = Math.max(0, Math.floor((Date.now() - reg.getTime()) / 86400000)); }

      // 特殊时段学习（早/晚/周末）
      var earlyStudy = false, nightStudy = false, weekendStudy = false;
      (ld.studyRecords || []).forEach(function (r) {
        if (!r || !r.timestamp) return;
        var dt = new Date(r.timestamp); var hh = dt.getHours(); var dw = dt.getDay();
        if (hh <= 6) earlyStudy = true;
        if (hh >= 22) nightStudy = true;
        if (dw === 0 || dw === 6) weekendStudy = true;
      });
      var likes = ld.likes || 0, ratings = ld.ratings || 0, shares = ld.shares || 0;

      // 与服务端一致的统计对象 d
      var d = {
        hours: hours, completed: completed, streak: streak, days: registerDays,
        nightStudy: nightStudy, earlyStudy: earlyStudy, weekendStudy: weekendStudy,
        examCount: examValid, examPassed: examPassed, perfectScore: perfectScore,
        trainingCount: trainingsCount, certificateCount: certCount,
        likes: likes, ratings: ratings, shares: shares
      };
      var achievements = MOBILE_BADGES.map(function (b) {
        var ok = false; try { ok = !!b.test(d); } catch (e) {}
        return { key: b.id, name: b.name, icon: b.icon, color: b.color, desc: b.desc, ok: ok };
      });
      var badgeCount = achievements.filter(function (a) { return a.ok; }).length;
      var achUnlocked = badgeCount;
      // 服务端徽章数（calculateBadgeCount）为权威值，覆盖本地 MOBILE_BADGES 估算，保证与 PC 端一致
      if (srvStats && srvStats.badgeCount != null) { badgeCount = srvStats.badgeCount; achUnlocked = badgeCount; }

      // 等级 / 经验值（统一走 window.XP 计算；优先用服务端 XP，其次共享持久化值，最后本地计算）
      var xp = (srvStats && srvStats.xp != null) ? srvStats.xp : XP.loadPersistedXp(App.userId());
      if (xp === null || xp === undefined) {
        xp = XP.calcXp({ hours: hours, completed: completed, streak: streak, badges: badgeCount, certificates: certCount });
      }
      // 持久化，保证下次即时展示且与 PC 端同步
      try { XP.saveXp(App.userId(), xp); } catch (e) {}
      // 供设置面板复用，避免重复拉取
      window.__mineStats = { hours: hours, completed: completed, streak: streak, badgeCount: badgeCount, certCount: certCount, xp: xp };

      var lv = XP.getLevelInfo(xp);
      var lvPct = Math.round(lv.currentExp / lv.requiredExp * 100);

      // ===== 个人信息区：仅显示等级（无经验条/连续学习） =====
      document.getElementById('m-lv').textContent = lv.level;

      // ===== 深色VIP卡 =====
      document.getElementById('m-lvring').style.setProperty('--p', lvPct + '%');
      document.getElementById('m-lvring-n').textContent = 'Lv.' + lv.level;
      document.getElementById('m-lvname').textContent = lv.name;
      document.getElementById('m-lvxp').textContent = xp + ' XP';
      document.getElementById('m-lvfill').style.width = lvPct + '%';
      document.getElementById('m-lvhint').innerHTML = lv.remainingExp > 0
        ? '距离 <b>Lv.' + (lv.level + 1) + '</b> 还需 <b>' + lv.remainingExp + ' XP</b>'
        : '已达成最高等级 <b>' + lv.name + '</b>，继续保持！';

      // ===== 学习统计（3列，全部为实际数据） =====
      animateValue({ el: document.getElementById('ts-badge'), to: badgeCount });
      animateValue({ el: document.getElementById('ts-done'), to: completed });
      document.getElementById('ts-cert').textContent = certCount;

      // ===== 原有统计数字（hidden 容器中保持兼容） =====
      animateValue({ el: document.getElementById('st-hours'), to: hours });
      animateValue({ el: document.getElementById('st-courses'), to: completed });
      animateValue({ el: document.getElementById('st-certs'), to: certCount });
      animateValue({ el: document.getElementById('st-ach'), to: achUnlocked });

      // ===== 功能网格数字 =====
      document.getElementById('gm-courses').textContent = completed;
      document.getElementById('gm-certs').textContent = certCount;
      document.getElementById('gm-exams').textContent = examCount;
      document.getElementById('gm-ach').textContent = achUnlocked;
      document.getElementById('gm-ach-total').textContent = '42';

      // ===== 学习概览卡 =====
      var pct = daysInMonth ? Math.round(monthStudied / daysInMonth * 100) : 0;
      animateValue({ el: document.getElementById('ov-hours'), to: hours });
      animateValue({ el: document.getElementById('ov-course'), to: completed });
      animateValue({ el: document.getElementById('ov-streak'), to: streak });
      var ring = document.getElementById('ov-ring');
      animateValue({ el: document.getElementById('ov-pct'), to: pct, fmt: function (v) { return v + '%'; }, onFrame: function (v) { ring.style.setProperty('--p', v + '%'); } });

      // 最近 7 天学习打卡
      var week = document.getElementById('ov-week');
      var whtml = '';
      for (var i = 6; i >= 0; i--) {
        var d = new Date(now); d.setDate(now.getDate() - i);
        var on = (ld.studyDates || []).indexOf(ymd(d)) >= 0;
        whtml += '<div class="m-wbar' + (on ? ' is-on' : '') + '"><div class="m-wbar__col"></div><div class="m-wbar__d">' + d.getDate() + '</div></div>';
      }
      week.innerHTML = whtml;

      // 欢迎语
      document.getElementById('m-welcome').textContent = name + '，今天也要坚持学习哦';

      // ===== 学习成就横滑墙 =====
      var achHtml = achievements.map(function (a) {
        var bg = a.ok ? 'background:linear-gradient(135deg,' + a.color + ',' + a.color + 'cc);' : '';
        var badge = '<div class="m-ach__badge" style="' + bg + '"><i class="fa-solid ' + a.icon + '"></i>' +
          (a.ok ? '' : '<span class="m-ach__lock"><i class="fa-solid fa-lock"></i></span>') + '</div>';
        return '<div class="m-ach' + (a.ok ? '' : ' is-locked') + '" data-ach="' + a.key + '">' + badge + '<div class="m-ach__name">' + a.name + '</div></div>';
      }).join('');
      document.getElementById('m-ach-scroll').innerHTML = achHtml;
      document.getElementById('m-ach-more').textContent = badgeCount + '/42';

      // （我的课程 / 我的培训 改为点网格按钮弹窗显示，不再内联渲染）

      // ===== 未读消息角标 =====
      try {
        var notifs = await Api.notifications() || [];
        var unread = notifs.filter(function (n) { return !n.read; }).length;
        if (unread > 0) {
          var badge = document.getElementById('m-notice-badge');
          badge.textContent = unread > 99 ? '99+' : unread;
          badge.hidden = false;
          document.getElementById('m-notice-sub') && (document.getElementById('m-notice-sub').textContent = unread + ' 条未读消息');
          // 导航栏红点
          var navBadge = document.getElementById('m-nav-badge');
          if (navBadge) { navBadge.hidden = false; navBadge.textContent = unread > 99 ? '99+' : unread; }
        }
      } catch (e) {}

      // ===== 设置开关回显 =====
      document.getElementById('sw-notify').checked = localStorage.getItem('m_set_notify') !== '0';
      document.getElementById('sw-remind').checked = localStorage.getItem('m_set_remind') !== '0';

      // ===== 事件绑定 =====
      bindMenuActions();
      bindAchPopover(achievements);

      // 铃铛按钮 → 消息中心
      var bellBtn = document.getElementById('m-bell-btn');
      if (bellBtn) bellBtn.addEventListener('click', function () { location.href = '/m/messages.html'; });

      // 深链
      var h = location.hash.replace('#', '');
      if (h === 'cert') setTimeout(openCert, 200);
      else if (h === 'notice') setTimeout(openNotice, 200);

      // 入场动画依次延迟
      document.querySelectorAll('.m-rise').forEach(function (el, i) {
        el.style.animationDelay = (i * 0.06) + 's';
      });
    }

    /* ========== 我的课程（改为点网格按钮弹窗显示） ========== */
    function courseItem(c, kind) {
      var cover = c.coverUrl || c.cover
        ? '<img src="' + App.esc(c.coverUrl || c.cover) + '">'
        : '<i class="fa-solid fa-book"></i>';
      var tag = kind === 'done'
        ? '<span class="m-course-item__tag m-course-item__tag--done">已完成</span>'
        : '<span class="m-course-item__tag m-course-item__tag--go">继续</span>';
      return '<div class="m-course-item" data-course="' + App.esc(c.id) + '">' +
        '<div class="m-course-item__cover">' + cover + '</div>' +
        '<div class="m-course-item__bd">' +
          '<div class="m-course-item__t">' + App.esc(c.title || '未命名课程') + '</div>' +
          '<div class="m-course-item__s">' + (c.lecturer || c.instructor ? '讲师 ' + App.esc(c.lecturer || c.instructor) : '点击开始学习') + '</div>' +
        '</div>' + tag + '</div>';
    }
    function buildCoursesHtml(courses, ld) {
      if (!Array.isArray(courses)) courses = [];
      var completedSet = {};
      (ld.completedCourses || []).forEach(function (id) { completedSet[String(id)] = 1; });
      var cont = [], done = [], discover = [];
      courses.forEach(function (c) {
        var id = String(c.id);
        var hasProgress = !!localStorage.getItem('mplayer:' + id);
        if (completedSet[id]) { done.push(c); }
        else if (hasProgress) { cont.push(c); }
        else { discover.push(c); }
      });
      if (!courses.length) return '<div class="m-sec-empty">暂无课程，去课程中心看看吧</div>';
      var html = '';
      if (cont.length) {
        html += '<div style="font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:8px"><i class="fa-solid fa-spinner fa-spin" style="color:#f59e0b"></i> 继续学习</div>';
        html += cont.slice(0, 3).map(function (c) { return courseItem(c, 'go'); }).join('');
      }
      if (done.length) {
        html += '<div style="font-size:13px;font-weight:700;color:var(--ink-2);margin:' + (cont.length ? '14px 0 8px' : '0 0 8px') + '"><i class="fa-solid fa-check-circle" style="color:#059669"></i> 已完成</div>';
        html += done.slice(0, 3).map(function (c) { return courseItem(c, 'done'); }).join('');
      }
      if (discover.length) {
        html += '<div style="margin-top:14px"><a href="/m/course.html" style="display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border:1px dashed var(--line);border-radius:12px;color:var(--brand-from);font-size:13px;font-weight:600">发现更多课程 <i class="fa-solid fa-arrow-right"></i></a></div>';
      }
      return html || '<div class="m-sec-empty">去课程中心开始第一门课程吧</div>';
    }

      var courses = [];

          if (a === 'settings') return openSettingsPanel();
          if (a === 'about') return App.toast('游雁学院 v1.0 · 让学习更美好');
          ({ cert: openCert, exam: openExam, learn: openLearn, streak: openLearn, notice: function () { location.href = '/m/messages.html'; }, hours: openLearn, profile: openProfile })[a]();
        });

    /* ========== 设置面板（从网格入口打开 · 顶部含等级卡） ========== */
    function openSettingsPanel() {
      // 动态读取当前用户等级数据（统一走 window.XP，优先使用共享持久化 XP，确保与 PC 端一致）
      var u = App.user || {};
      var ms = window.__mineStats || {};
      var xp = (ms.xp != null) ? ms.xp : XP.loadPersistedXp(App.userId());
      if (xp === null || xp === undefined) {
        xp = XP.calcXp({
          hours: parseFloat(u.hours||0) || (ms.hours||0), completed: parseInt(u.coursesCompleted||0) || (ms.completed||0),
          streak: parseInt(u.streak||0) || (ms.streak||0), badges: parseInt((u.badges&&u.badges.length)||0) || (ms.badgeCount||0),
          certificates: parseInt((u.certificates&&u.certificates.length)||0) || (ms.certCount||0)
        });
      }
      var li = XP.getLevelInfo(xp);
      var prevReq = li.level > 0 ? XP.LEVEL_CONFIG[li.level-1].expRequired : 0;
      var pct = li.level >= XP.LEVEL_CONFIG.length ? 100 : Math.round((xp - prevReq) / (li.requiredExp - prevReq) * 100);

      // 等级信息卡（深色VIP风格）
      var vipCard =
        '<div style="background:linear-gradient(135deg,#1e293b,#334155,#1e293b);border-radius:16px;padding:18px 16px 14px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 8px 24px -8px rgba(30,41,59,.5)">' +
        '<div style="position:absolute;right:-20px;top:-25px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,.12),transparent 70%);pointer-events:none"></div>' +
        '<div style="display:flex;align-items:center;gap:12px;position:relative;z-index:1">' +
          // 头像
          '<div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:2px solid rgba(255,255,255,.15);box-shadow:0 2px 10px -3px rgba(102,126,234,.45)">' + (u.name ? u.name.charAt(0) : '学') + '</div>' +
          // 信息
          '<div style="flex:1;min-width:0">' +
            '<div style="display:flex;align-items:center;gap:6px">' +
              '<span style="font-size:16px;font-weight:800;color:#fff">' + App.esc(u.name||'学员') + '</span>' +
              '<span style="display:inline-flex;align-items:center;padding:1px 8px;border-radius:8px;background:linear-gradient(135deg,#f0e6ff,#ede8fe);color:#7c3aed;font-size:10.5px;font-weight:700">Lv.' + li.level + '</span>' +
            '</div>' +
            '<div style="font-size:12px;color:rgba(255,255,255,.5);margin-top:2px">' + App.esc(u.role||'学员') + ' · ' + App.esc(u.department||'游雁学院') + '</div>' +
          '</div>' +
          // 勋章
          '<div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0;gap:2px">' +
            '<div style="width:52px;height:56px;position:relative;display:flex;align-items:center;justify-content:center">' +
              '<div style="width:42px;height:46px;background:linear-gradient(180deg,#e0e7ff,#c7d2fe,#a5b4fc);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px -3px rgba(99,102,244,.5),inset 0 1px 0 rgba(255,255,255,.7);z-index:2;position:relative"><span style="font-size:11px;font-weight:900;color:#3730a3;text-shadow:0 1px 0 rgba(255,255,255,.5)">Lv.' + li.level + '</span></div>' +
              '<div style="position:absolute;inset:0;border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 60%,black 61%);mask:radial-gradient(circle,transparent 60%,black 61%);background:conic-gradient(from 180deg,#818cf8 ' + pct + '%,rgba(129,140,248,.15) 0)"></div>' +
            '</div>' +
            '<span style="font-size:10.5px;font-weight:700;color:rgba(255,255,255,.6)">' + xp + ' XP</span>' +
          '</div>' +
        '</div>' +
        // 进度条
        '<div style="height:5px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:12px;position:relative;z-index:1"><div style="height:100%;width:' + pct + '%;background:linear-gradient(90deg,#818cf8,#a78bfa,#c084fc);border-radius:99px"></div></div>' +
        '<div style="font-size:11px;color:rgba(255,255,255,.42);margin-top:6px;position:relative;z-index:1">' +
          (li.isMax ? '已达到最高等级！' : '距离 <b style="color:rgba(255,255,255,.8)">Lv.'+(li.level+1)+' '+li.nextName+'</b> 还需 <b style="color:rgba(255,255,255,.8)">'+li.remainingExp+' XP</b>') +
        '</div></div>';

      var html = '<div class="m-sheet__hd"><div class="m-sheet__title">我的</div></div><div class="m-sheet__body">' + vipCard +
        '<div class="m-menu-group" style="margin:0;box-shadow:none;border:1px solid var(--line)">' +
        '<div class="m-menu-row" data-act="profile"><div class="m-menu-row__ic" style="background:linear-gradient(135deg,#64748b,#475569)"><i class="fa-solid fa-user-pen"></i></div><div class="m-menu-row__bd"><div class="m-menu-row__t">个人资料</div><div class="m-menu-row__s">姓名 / 部门 / 联系方式</div></div><i class="m-menu-row__arrow fa-solid fa-chevron-right"></i></div>' +
        '<div class="m-menu-row" data-act="pwd"><div class="m-menu-row__ic" style="background:linear-gradient(135deg,#0ea5e9,#0284c7)"><i class="fa-solid fa-lock"></i></div><div class="m-menu-row__bd"><div class="m-menu-row__t">修改密码</div><div class="m-menu-row__s">定期修改保护账户安全</div></div><i class="m-menu-row__arrow fa-solid fa-chevron-right"></i></div>' +
        '<div class="m-menu-row" data-act="notify"><div class="m-menu-row__ic" style="background:linear-gradient(135deg,#f59e0b,#d97706)"><i class="fa-solid fa-bell"></i></div><div class="m-menu-row__bd"><div class="m-menu-row__t">消息通知</div><div class="m-menu-row__s">接收学习提醒与公告</div></div><label class="m-switch"><input type="checkbox" id="sw-notify2"><span class="m-switch__track"></span></label></div>' +
        '<div class="m-menu-row" data-act="remind"><div class="m-menu-row__ic" style="background:linear-gradient(135deg,#ec4899,#db2777)"><i class="fa-solid fa-clock"></i></div><div class="m-menu-row__bd"><div class="m-menu-row__t">学习提醒</div><div class="m-menu-row__s">每日学习目标推送</div></div><label class="m-switch"><input type="checkbox" id="sw-remind2"><span class="m-switch__track"></span></label></div>' +
        '<div class="m-menu-row" data-act="export"><div class="m-menu-row__ic" style="background:linear-gradient(135deg,#14b8a6,#0d9488)"><i class="fa-solid fa-download"></i></div><div class="m-menu-row__bd"><div class="m-menu-row__t">导出学习数据</div><div class="m-menu-row__s">下载学习记录与证书</div></div><i class="m-menu-row__arrow fa-solid fa-chevron-right"></i></div>' +
        '<div class="m-menu-row" data-act="del"><div class="m-menu-row__ic" style="background:#fef2f2;color:#ef4444"><i class="fa-solid fa-trash-can"></i></div><div class="m-menu-row__bd"><div class="m-menu-row__t" style="color:#ef4444">注销账户</div><div class="m-menu-row__s">永久删除账户与数据</div></div><i class="m-menu-row__arrow fa-solid fa-chevron-right" style="color:#ef4444"></i></div>' +
        '<div class="m-menu-row" data-act="logout"><div class="m-menu-row__ic" style="background:#fef2f2;color:#ef4444"><i class="fa-solid fa-right-from-bracket"></i></div><div class="m-menu-row__bd"><div class="m-menu-row__t" style="color:#ef4444">退出登录</div></div><i class="m-menu-row__arrow fa-solid fa-chevron-right" style="color:#ef4444"></i></div>' +
        '</div></div>';
      App.openSheet(html);
      // 绑定面板内事件
      var sn2 = document.getElementById('sw-notify2'), sr2 = document.getElementById('sw-remind2');
      if (sn2) { sn2.checked = localStorage.getItem('m_set_notify') !== '0'; sn2.addEventListener('change', function () { localStorage.setItem('m_set_notify', sn2.checked ? '1' : '0'); App.toast(sn2.checked ? '已开启消息通知' : '已关闭消息通知'); document.getElementById('sw-notify') && (document.getElementById('sw-notify').checked = sn2.checked); }); }
      if (sr2) { sr2.checked = localStorage.getItem('m_set_remind') !== '0'; sr2.addEventListener('change', function () { localStorage.setItem('m_set_remind', sr2.checked ? '1' : '0'); App.toast(sr2.checked ? '已开启学习提醒' : '已关闭学习提醒'); document.getElementById('sw-remind') && (document.getElementById('sw-remind').checked = sr2.checked); }); }
      // 面板内的 data-act 项
      var panel = document.querySelector('.m-sheet.is-open .m-sheet__body');
      if (panel) panel.querySelectorAll('[data-act]').forEach(function (el) {
        el.addEventListener('click', function (ev) {
          if (ev.target.closest('.m-switch')) return;
          var a = el.getAttribute('data-act');
          if (a === 'profile') { App.closeSheet(); setTimeout(openProfile, 250); return; }
          if (a === 'pwd') { App.closeSheet(); setTimeout(openChangePwd, 250); return; }
          if (a === 'export') { App.closeSheet(); setTimeout(exportData, 250); return; }
          if (a === 'del') { App.closeSheet(); setTimeout(confirmDelete, 250); return; }
          if (a === 'logout') { App.logout(); return; }
          if (a === 'notify' || a === 'remind') { var s = el.querySelector('input'); if (s) { s.checked = !s.checked; s.dispatchEvent(new Event('change')); } return; }
        });
      });
    }

    /* ========== 修改密码 ========== */
    function openChangePwd() {
      var html = '<div class="m-sheet__hd"><div class="m-sheet__title">修改密码</div></div><div class="m-sheet__body">' +
        '<label class="m-label">当前密码</label><input class="m-input" id="pw-old" type="password" placeholder="请输入当前密码" style="margin-bottom:12px">' +
        '<label class="m-label">新密码</label><input class="m-input" id="pw-new" type="password" placeholder="至少 6 位" style="margin-bottom:12px">' +
        '<label class="m-label">确认新密码</label><input class="m-input" id="pw-new2" type="password" placeholder="再次输入新密码" style="margin-bottom:16px">' +
        '<button class="m-btn m-btn--block" id="pw-save">保存</button>' +
        '<p style="font-size:12px;color:var(--ink-3);margin-top:10px;text-align:center">当前为演示环境，自助改密将连接后台后开放</p></div>';
      App.openSheet(html);
      document.getElementById('pw-save').addEventListener('click', async function () {
        var oldP = document.getElementById('pw-old').value.trim();
        var newP = document.getElementById('pw-new').value.trim();
        var newP2 = document.getElementById('pw-new2').value.trim();
        if (!oldP || !newP) return App.toast('请填写完整', 'error');
        if (newP.length < 6) return App.toast('新密码至少 6 位', 'error');
        if (newP !== newP2) return App.toast('两次输入不一致', 'error');
        App.showLoading('提交中...');
        try {
          await Api.put('/auth/password', { oldPassword: oldP, newPassword: newP });
          App.hideLoading(); App.toast('密码已修改'); App.closeSheet();
        } catch (e) {
          App.hideLoading();
          App.toast('暂不支持自助修改，请联系管理员', 'error');
        }
      });
    }

    /* ========== 导出学习数据 ========== */
    async function exportData() {
      App.showLoading('导出中...');
      try {
        var key = 'user_learning_' + App.userId();
        var ld = {}; try { ld = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) {}
        var certs = [], exams = [], notifs = [], trains = [];
        try { certs = await Api.certificates() || []; } catch (e) {}
        try { exams = await Api.examRecords() || []; } catch (e) {}
        try { notifs = await Api.notifications() || []; } catch (e) {}
        try { var tr = await Api.userTrainings(); trains = (tr && tr.list) || []; } catch (e) {}
        var payload = {
          user: App.user(),
          exportedAt: new Date().toISOString(),
          learning: ld,
          certificates: certs,
          examRecords: exams,
          notifications: notifs,
          trainings: trains
        };
        var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = '游雁学院_学习数据_' + (App.userName() || 'user') + '.json';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        App.hideLoading(); App.toast('已导出');
      } catch (e) { App.hideLoading(); App.toast('导出失败', 'error'); }
    }

    /* ========== 注销账户 ========== */
    function confirmDelete() {
      var html = '<div class="m-sheet__hd"><div class="m-sheet__title">注销账户</div></div><div class="m-sheet__body">' +
        '<div style="text-align:center;padding:8px 0 16px">' +
        '<div style="width:64px;height:64px;border-radius:50%;margin:0 auto 12px;background:#fef2f2;color:#ef4444;display:flex;align-items:center;justify-content:center;font-size:28px"><i class="fa-solid fa-triangle-exclamation"></i></div>' +
        '<div style="font-size:15px;font-weight:700;color:#1f2330">确认注销账户？</div>' +
        '<div style="font-size:13px;color:#5b6172;margin-top:6px">此操作将清除本地学习数据并退出登录，且不可恢复。</div></div>' +
        '<button class="m-btn m-btn--block" id="del-confirm" style="background:#ef4444">确认注销</button>' +
        '<button class="m-btn m-btn--block m-btn--ghost" id="del-cancel" style="margin-top:10px">取消</button></div>';
      App.openSheet(html);
      document.getElementById('del-cancel').addEventListener('click', function () { App.closeSheet(); });
      document.getElementById('del-confirm').addEventListener('click', function () {
        try { localStorage.removeItem('user_learning_' + App.userId()); } catch (e) {}
        App.toast('账户已注销'); App.closeSheet(); App.logout();
      });
    }

    /* ========== 各弹层功能 ========== */
    async function openCert() {
      App.showLoading();
      try {
        var list = await Api.certificates() || [];
        App.hideLoading();
        var html = '<div class="m-sheet__hd"><div class="m-sheet__title">我的证书</div></div><div class="m-sheet__body">';
        if (!list.length) html += '<div class="m-empty"><i class="fa-regular fa-award"></i>暂无证书<br><span style="font-size:12px">完成培训课程后即可获得证书</span></div>';
        else html += list.map(function (c) {
          var img = c.imageUrl ? '<img src="' + App.esc(c.imageUrl) + '" style="width:100%;border-radius:12px">' :
            '<div style="height:120px;border-radius:12px;background:var(--brand-grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px">' + App.esc(c.title || '证书') + '</div>';
          return '<div class="m-cert"><div style="padding:8px">' + img + '</div>' +
            '<div class="m-cert__bd"><div class="m-cert__t">' + App.esc(c.title || '培训证书') + '</div>' +
            '<div class="m-cert__s">颁发：' + App.fmtDate(c.issuedAt || c.createdAt) + '</div></div></div>';
        }).join('');
        html += '</div>';
        App.openSheet(html);
      } catch (e) { App.hideLoading(); App.toast('证书加载失败', 'error'); }
    }

    async function openExam() {
      App.showLoading();
      try {
        var list = await Api.examRecords() || [];
        App.hideLoading();
        var html = '<div class="m-sheet__hd"><div class="m-sheet__title">考试记录</div></div><div class="m-sheet__body">';
        if (!list.length) html += '<div class="m-empty"><i class="fa-regular fa-file-pen"></i>暂无考试记录</div>';
        else html += list.slice().reverse().map(function (r) {
          var title = r.examName || r.title || ('考试 #' + r.examId);
          var score = (r.score != null) ? r.score : '-';
          var pass = r.passed || r.isPassed;
          var when = App.fmtDateTime(r.submittedAt || r.createdAt || r.time);
          var badge = pass ? '<span class="m-badge m-badge--signin">及格</span>' : '<span class="m-badge m-badge--exam">未及格</span>';
          return '<div class="m-row"><div class="m-row__ic"><i class="fa-solid fa-file-pen"></i></div>' +
            '<div class="m-row__bd"><div class="m-row__t" style="font-size:13.5px">' + App.esc(title) + '</div>' +
            '<div class="m-row__s">得分 ' + score + ' · ' + when + '</div></div>' + badge + '</div>';
        }).join('');
        html += '</div>';
        App.openSheet(html);
      } catch (e) { App.hideLoading(); App.toast('记录加载失败', 'error'); }
    }

    function openLearn() {
      var key = 'user_learning_' + App.userId();
      var ld = {};
      try { ld = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) {}
      var hours = Math.floor((ld.totalSeconds || (ld.totalHours || 0) * 3600) / 3600);
      var completed = (ld.completedCourses || []).length;
      var days = (ld.studyDates || []).length;
      var html = '<div class="m-sheet__hd"><div class="m-sheet__title">学习记录</div></div><div class="m-sheet__body">' +
        '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px">' +
          '<div class="m-stat" style="margin:0"><div class="m-stat__v">' + hours + '</div><div class="m-stat__l">累计学时(h)</div></div>' +
          '<div class="m-stat" style="margin:0"><div class="m-stat__v">' + completed + '</div><div class="m-stat__l">完成课程</div></div>' +
          '<div class="m-stat" style="margin:0"><div class="m-stat__v">' + days + '</div><div class="m-stat__l">学习天数</div></div>' +
          '<div class="m-stat" style="margin:0"><div class="m-stat__v">' + (ld.ratings || 0) + '</div><div class="m-stat__l">好评数</div></div>' +
        '</div>' +
        '<div class="m-row"><div class="m-row__ic"><i class="fa-solid fa-share"></i></div><div class="m-row__bd"><div class="m-row__t" style="font-size:13.5px">分享次数</div></div><span class="m-row__s">' + (ld.shares || 0) + '</span></div>' +
        '<div class="m-row"><div class="m-row__ic"><i class="fa-solid fa-heart"></i></div><div class="m-row__bd"><div class="m-row__t" style="font-size:13.5px">点赞次数</div></div><span class="m-row__s">' + (ld.likes || 0) + '</span></div>' +
        '</div>';
      App.openSheet(html);
    }

    async function openNotice() {
      App.showLoading();
      try {
        var list = await Api.notifications() || [];
        App.hideLoading();
        var html = '<div class="m-sheet__hd"><div class="m-sheet__title">消息通知</div></div><div class="m-sheet__body">';
        if (!list.length) html += '<div class="m-empty"><i class="fa-regular fa-bell"></i>暂无消息</div>';
        else html += list.slice().reverse().map(function (n) {
          var unread = !n.read;
          return '<div class="m-notice" data-id="' + n.id + '" style="cursor:pointer">' +
            '<div class="m-notice__ic"><i class="fa-solid fa-bell"></i></div>' +
            '<div class="m-notice__bd"><div class="m-notice__t">' + App.esc(n.title) + (unread ? ' <span class="m-badge m-badge--exam">未读</span>' : '') + '</div>' +
            '<div class="m-notice__d">' + App.esc(n.content ? n.content.replace(/<[^>]+>/g, '').slice(0, 40) : '') + '</div></div></div>';
        }).join('');
        html += '</div>';
        App.openSheet(html);
        document.querySelectorAll('#m-sheet-body .m-notice[data-id]').forEach(function (el) {
          el.addEventListener('click', async function () {
            try { await Api.markRead(el.getAttribute('data-id')); } catch (e) {}
            el.querySelector('.m-badge') && el.querySelector('.m-badge').remove();
          });
        });
      } catch (e) { App.hideLoading(); App.toast('消息加载失败', 'error'); }
    }

    function openProfile() {
      var u = App.user() || {};
      var html = '<div class="m-sheet__hd"><div class="m-sheet__title">个人资料</div></div><div class="m-sheet__body">' +
        '<label class="m-label">姓名</label><input class="m-input" id="pf-name" value="' + App.esc(u.realName || u.real_name || u.username || '') + '" style="margin-bottom:12px">' +
        '<label class="m-label">部门</label><input class="m-input" id="pf-dep" value="' + App.esc(u.department || '') + '" style="margin-bottom:12px">' +
        '<label class="m-label">职位</label><input class="m-input" id="pf-pos" value="' + App.esc(u.position || '') + '" style="margin-bottom:12px">' +
        '<label class="m-label">手机号</label><input class="m-input" id="pf-phone" value="' + App.esc(u.phone || '') + '" style="margin-bottom:16px">' +
        '<button class="m-btn m-btn--block" id="pf-save">保存</button></div>';
      App.openSheet(html);
      document.getElementById('pf-save').addEventListener('click', saveProfile);
    }

    async function saveProfile() {
      var payload = {
        realName: document.getElementById('pf-name').value.trim(),
        department: document.getElementById('pf-dep').value.trim(),
        position: document.getElementById('pf-pos').value.trim(),
        phone: document.getElementById('pf-phone').value.trim()
      };
      App.showLoading('保存中...');
      try {
        var r = await Api.profileUpdate(payload);
        var u = App.user() || {};
        Object.assign(u, payload);
        try { localStorage.setItem('user', JSON.stringify(u)); sessionStorage.setItem('user', JSON.stringify(u)); } catch (e) {}
        App.hideLoading(); App.toast('资料已保存'); App.closeSheet(); initMine();
      } catch (e) { App.hideLoading(); App.toast(e.message || '保存失败', 'error'); }
    }

    App.initPage({ active: 'mine', requireAuth: true, onReady: initMine });
  </script>
</body>
</html>
