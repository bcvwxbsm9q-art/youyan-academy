<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>我的 · 游雁学院</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#667eea', secondary: '#764ba2' } } } };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/m/css/mobile.css">
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="m-nav">
      <div class="m-nav__left"><span class="m-nav__title">我的</span></div>
      <div class="m-nav__right"></div>
    </header>

    <!-- 个人主卡片（渐变背景） -->
    <section style="margin:14px">
      <div class="m-profile" id="m-profile-card">
        <div class="m-profile__top">
          <div class="m-profile__av" id="m-avatar">学</div>
          <div class="m-profile__info">
            <div class="m-profile__name" id="m-name">学员</div>
            <div class="m-profile__dep" id="m-dep">游雁学院学员</div>
          </div>
        </div>
      </div>
    </section>

    <!-- 数据统计 -->
    <div class="m-stats" id="m-stats-row">
      <div class="m-stat"><div class="m-stat__v" id="st-hours">0</div><div class="m-stat__l">学习时长</div></div>
      <div class="m-stat"><div class="m-stat__v" id="st-certs">0</div><div class="m-stat__l">证书</div></div>
      <div class="m-stat"><div class="m-stat__v" id="st-exams">0</div><div class="m-stat__l">考试</div></div>
      <div class="m-stat"><div class="m-stat__v" id="st-days">0</div><div class="m-stat__l">学习天数</div></div>
    </div>

    <!-- 成就数据卡片（参考图风格） -->
    <div class="m-badges-section">
      <div class="m-hd" style="margin:0 0 12px">
        <div class="m-hd__t"><i class="fa-solid fa-trophy"></i> 我的成就</div>
      </div>
      <div class="m-achievement-grid" id="m-achieve-grid">
        <div class="m-achieve-card" data-act="cert">
          <span class="m-achieve-card__icon" style="color:#f59e0b"><i class="fa-solid fa-certificate"></i></span>
          <div class="m-achieve-card__label">荣誉证书</div>
          <div><span class="m-achieve-card__value" id="bd-cert">0</span><span class="m-achieve-card__unit">本</span></div>
        </div>
        <div class="m-achieve-card" data-act="course">
          <span class="m-achieve-card__icon" style="color:#10b981"><i class="fa-solid fa-graduation-cap"></i></span>
          <div class="m-achieve-card__label">完成课程</div>
          <div><span class="m-achieve-card__value" id="bd-course">0</span><span class="m-achieve-card__unit">门</span></div>
        </div>
        <div class="m-achieve-card" data-act="exam">
          <span class="m-achieve-card__icon" style="color:#3b82f6"><i class="fa-solid fa-file-pen"></i></span>
          <div class="m-achieve-card__label">通过考试</div>
          <div><span class="m-achieve-card__value" id="bd-exam">0</span><span class="m-achieve-card__unit">次</span></div>
        </div>
        <div class="m-achieve-card" data-act="learn">
          <span class="m-achieve-card__icon" style="color:#8b5cf6"><i class="fa-solid fa-clock"></i></span>
          <div class="m-achieve-card__label">学习时长</div>
          <div><span class="m-achieve-card__value" id="bd-hours">0</span><span class="m-achieve-card__unit">小时</span></div>
        </div>
        <div class="m-achieve-card" data-act="streak">
          <span class="m-achieve-card__icon" style="color:#ef4444"><i class="fa-solid fa-fire"></i></span>
          <div class="m-achieve-card__label">连续学习</div>
          <div><span class="m-achieve-card__value" id="bd-streak">0</span><span class="m-achieve-card__unit">天</span></div>
        </div>
        <div class="m-achieve-card" data-act="notice">
          <span class="m-achieve-card__icon" style="color:#ec4899"><i class="fa-solid fa-bell"></i></span>
          <div class="m-achieve-card__label">消息通知</div>
          <div><span class="m-achieve-card__value" id="bd-msg">0</span><span class="m-achieve-card__unit">条</span></div>
        </div>
      </div>
    </div>

    <!-- 功能菜单 -->
    <div class="m-menu-group" id="m-menu-group">
      <div class="m-menu-row" data-act="cert">
        <div class="m-menu-row__ic" style="background:linear-gradient(135deg,#f59e0b,#d97706)"><i class="fa-solid fa-certificate"></i></div>
        <div class="m-menu-row__bd"><div class="m-menu-row__t">我的证书</div></div>
        <i class="m-menu-row__arrow fa-solid fa-chevron-right"></i>
      </div>
      <div class="m-menu-row" data-act="exam">
        <div class="m-menu-row__ic" style="background:linear-gradient(135deg,#3b82f6,#2563eb)"><i class="fa-solid fa-file-pen"></i></div>
        <div class="m-menu-row__bd"><div class="m-menu-row__t">考试记录</div></div>
        <i class="m-menu-row__arrow fa-solid fa-chevron-right"></i>
      </div>
      <div class="m-menu-row" data-act="learn">
        <div class="m-menu-row__ic" style="background:linear-gradient(135deg,#10b981,#059669)"><i class="fa-solid fa-chart-line"></i></div>
        <div class="m-menu-row__bd"><div class="m-menu-row__t">学习记录</div></div>
        <i class="m-menu-row__arrow fa-solid fa-chevron-right"></i>
      </div>
      <div class="m-menu-row" data-act="notice">
        <div class="m-menu-row__ic" style="background:linear-gradient(135deg,#8b5cf6,#7c3aed)"><i class="fa-solid fa-bell"></i></div>
        <div class="m-menu-row__bd"><div class="m-menu-row__t">消息通知</div></div>
        <i class="m-menu-row__arrow fa-solid fa-chevron-right"></i>
      </div>
      <div class="m-menu-row" data-act="logout">
        <div class="m-menu-row__ic" style="background:#fef2f2;color:#ef4444"><i class="fa-solid fa-right-from-bracket"></i></div>
        <div class="m-menu-row__bd"><div class="m-menu-row__t" style="color:#ef4444">退出登录</div></div>
        <i class="m-menu-row__arrow fa-solid fa-chevron-right" style="color:#ef4444"></i>
      </div>
    </div>
  </div>

  <script src="/js/auth-modal.js?v=20260723m"></script>
  <script src="/m/js/api-client.js"></script>
  <script src="/m/js/common.js"></script>
  <script src="/m/js/scan.js"></script>
  <script>
    function avatarText(name) { return name ? name.charAt(0) : '学'; }

    async function initMine() {
      var u = App.user() || {};
      var name = App.userName();
      document.getElementById('m-name').textContent = name;
      document.getElementById('m-dep').textContent = [u.department, u.position].filter(Boolean).join(' · ') || '游雁学院学员';

      // 头像
      var av = document.getElementById('m-avatar');
      if (u.avatar) { av.outerHTML = '<img class="m-profile__av" id="m-avatar" src="' + App.esc(u.avatar) + '">'; }
      else { av.textContent = avatarText(name); }

      // 数据
      var certs = [], exams = [];
      try { certs = await Api.certificates() || []; } catch (e) {}
      try { exams = await Api.examRecords() || []; } catch (e) {}

      var certCount = certs.length;
      var examCount = exams.length;
      var passCount = exams.filter(function (r) { return r.passed || r.isPassed; }).length;

      // 学习数据
      var key = 'user_learning_' + App.userId();
      var ld = {};
      try { ld = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) {}
      var hours = Math.floor((ld.totalSeconds || (ld.totalHours || 0) * 3600) / 3600) || (ld.totalHours || 0);
      var completed = (ld.completedCourses || []).length;
      var studyDays = (ld.studyDates || []).length;

      // 统计数字
      document.getElementById('st-hours').textContent = hours;
      document.getElementById('st-certs').textContent = certCount;
      document.getElementById('st-exams').textContent = examCount;
      document.getElementById('st-days').textContent = studyDays;

      // 勋章数字（成就卡片）
      document.getElementById('bd-cert').textContent = certCount;
      document.getElementById('bd-exam').textContent = passCount;
      document.getElementById('bd-course').textContent = completed;
      document.getElementById('bd-streak').textContent = studyDays > 1 ? studyDays : studyDays;
      document.getElementById('bd-hours').textContent = hours;
      try {
        var notifs = await Api.notifications() || [];
        var unread = notifs.filter(function (n) { return !n.read; }).length;
        document.getElementById('bd-msg').textContent = unread;
      } catch (e) { document.getElementById('bd-msg').textContent = '-'; }

      // 菜单事件
      document.querySelectorAll('[data-act]').forEach(function (el) {
        el.addEventListener('click', function () {
          var a = el.getAttribute('data-act');
          if (!a) return;
          if (a === 'logout') return App.logout();
          ({ cert: openCert, exam: openExam, learn: openLearn, streak: openLearn, notice: openNotice, hours: openLearn, profile: openProfile })[a]();
        });
      });

      // 深链
      var h = location.hash.replace('#', '');
      if (h === 'cert') setTimeout(openCert, 200);
      else if (h === 'notice') setTimeout(openNotice, 200);
    }

    /* ========== 各弹层功能（复用原有逻辑，UI升级） ========== */

    async function openCert() {
      App.showLoading();
      try {
        var list = await Api.certificates() || [];
        App.hideLoading();
        var html = '<div class="m-sheet__hd"><div class="m-sheet__title">我的证书</div></div><div class="m-sheet__body">';
        if (!list.length) html += '<div class="m-empty"><i class="fa-regular fa-award"></i>暂无证书<br><span style="font-size:12px">完成培训课程后即可获得证书</span></div>';
        else html += list.map(function (c) {
          var img = c.imageUrl ? '<img src="' + App.esc(c.imageUrl) + '" style="width:100%;border-radius:12px">' :
            '<div style="height:120px;border-radius:12px;background:var(--brand-grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px">' + App.esc(c.title || '证书') + '</div>';
          return '<div class="m-cert"><div style="padding:8px">' + img + '</div>' +
            '<div class="m-cert__bd"><div class="m-cert__t">' + App.esc(c.title || '培训证书') + '</div>' +
            '<div class="m-cert__s">颁发：' + App.fmtDate(c.issuedAt || c.createdAt) + '</div></div></div>';
        }).join('');
        html += '</div>';
        App.openSheet(html);
      } catch (e) { App.hideLoading(); App.toast('证书加载失败', 'error'); }
    }

    async function openExam() {
      App.showLoading();
      try {
        var list = await Api.examRecords() || [];
        App.hideLoading();
        var html = '<div class="m-sheet__hd"><div class="m-sheet__title">考试记录</div></div><div class="m-sheet__body">';
        if (!list.length) html += '<div class="m-empty"><i class="fa-regular fa-file-pen"></i>暂无考试记录</div>';
        else html += list.slice().reverse().map(function (r) {
          var title = r.examName || r.title || ('考试 #' + r.examId);
          var score = (r.score != null) ? r.score : '-';
          var pass = r.passed || r.isPassed;
          var when = App.fmtDateTime(r.submittedAt || r.createdAt || r.time);
          var badge = pass ? '<span class="m-badge m-badge--signin">及格</span>' : '<span class="m-badge m-badge--exam">未及格</span>';
          return '<div class="m-row"><div class="m-row__ic"><i class="fa-solid fa-file-pen"></i></div>' +
            '<div class="m-row__bd"><div class="m-row__t" style="font-size:13.5px">' + App.esc(title) + '</div>' +
            '<div class="m-row__s">得分 ' + score + ' · ' + when + '</div></div>' + badge + '</div>';
        }).join('');
        html += '</div>';
        App.openSheet(html);
      } catch (e) { App.hideLoading(); App.toast('记录加载失败', 'error'); }
    }

    function openLearn() {
      var key = 'user_learning_' + App.userId();
      var ld = {};
      try { ld = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) {}
      var hours = Math.floor((ld.totalSeconds || (ld.totalHours || 0) * 3600) / 3600);
      var completed = (ld.completedCourses || []).length;
      var days = (ld.studyDates || []).length;
      var html = '<div class="m-sheet__hd"><div class="m-sheet__title">学习记录</div></div><div class="m-sheet__body">' +
        '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px">' +
          '<div class="m-stat" style="margin:0"><div class="m-stat__v">' + hours + '</div><div class="m-stat__l">累计学时(h)</div></div>' +
          '<div class="m-stat" style="margin:0"><div class="m-stat__v">' + completed + '</div><div class="m-stat__l">完成课程</div></div>' +
          '<div class="m-stat" style="margin:0"><div class="m-stat__v">' + days + '</div><div class="m-stat__l">学习天数</div></div>' +
          '<div class="m-stat" style="margin:0"><div class="m-stat__v">' + (ld.ratings || 0) + '</div><div class="m-stat__l">好评数</div></div>' +
        '</div>' +
        '<div class="m-row"><div class="m-row__ic"><i class="fa-solid fa-share"></i></div><div class="m-row__bd"><div class="m-row__t" style="font-size:13.5px">分享次数</div></div><span class="m-row__s">' + (ld.shares || 0) + '</span></div>' +
        '<div class="m-row"><div class="m-row__ic"><i class="fa-solid fa-heart"></i></div><div class="m-row__bd"><div class="m-row__t" style="font-size:13.5px">点赞次数</div></div><span class="m-row__s">' + (ld.likes || 0) + '</span></div>' +
        '</div>';
      App.openSheet(html);
    }

    async function openNotice() {
      App.showLoading();
      try {
        var list = await Api.notifications() || [];
        App.hideLoading();
        var html = '<div class="m-sheet__hd"><div class="m-sheet__title">消息通知</div></div><div class="m-sheet__body">';
        if (!list.length) html += '<div class="m-empty"><i class="fa-regular fa-bell"></i>暂无消息</div>';
        else html += list.slice().reverse().map(function (n) {
          var unread = !n.read;
          return '<div class="m-notice" data-id="' + n.id + '" style="cursor:pointer">' +
            '<div class="m-notice__ic"><i class="fa-solid fa-bell' + (unread ? '' : '') + '"></i></div>' +
            '<div class="m-notice__bd"><div class="m-notice__t">' + App.esc(n.title) + (unread ? ' <span class="m-badge m-badge--exam">未读</span>' : '') + '</div>' +
            '<div class="m-notice__d">' + App.esc(n.content ? n.content.replace(/<[^>]+>/g, '').slice(0, 40) : '') + '</div></div></div>';
        }).join('');
        html += '</div>';
        App.openSheet(html);
        document.querySelectorAll('#m-sheet-body .m-notice[data-id]').forEach(function (el) {
          el.addEventListener('click', async function () {
            var id = el.getAttribute('id') ? el.getAttribute('id').replace('notice-','') : el.getAttribute('data-id');
            try { await Api.markRead(el.getAttribute('data-id')); } catch (e) {}
            el.querySelector('.m-badge') && el.querySelector('.m-badge').remove();
          });
        });
      } catch (e) { App.hideLoading(); App.toast('消息加载失败', 'error'); }
    }

    function openProfile() {
      var u = App.user() || {};
      var html = '<div class="m-sheet__hd"><div class="m-sheet__title">个人资料</div></div><div class="m-sheet__body">' +
        '<label class="m-label">姓名</label><input class="m-input" id="pf-name" value="' + App.esc(u.realName || u.real_name || u.username || '') + '" style="margin-bottom:12px">' +
        '<label class="m-label">部门</label><input class="m-input" id="pf-dep" value="' + App.esc(u.department || '') + '" style="margin-bottom:12px">' +
        '<label class="m-label">职位</label><input class="m-input" id="pf-pos" value="' + App.esc(u.position || '') + '" style="margin-bottom:12px">' +
        '<label class="m-label">手机号</label><input class="m-input" id="pf-phone" value="' + App.esc(u.phone || '') + '" style="margin-bottom:16px">' +
        '<button class="m-btn m-btn--block" id="pf-save">保存</button></div>';
      App.openSheet(html);
      document.getElementById('pf-save').addEventListener('click', saveProfile);
    }

    async function saveProfile() {
      var payload = {
        realName: document.getElementById('pf-name').value.trim(),
        department: document.getElementById('pf-dep').value.trim(),
        position: document.getElementById('pf-pos').value.trim(),
        phone: document.getElementById('pf-phone').value.trim()
      };
      App.showLoading('保存中...');
      try {
        var r = await Api.profileUpdate(payload);
        var u = App.user() || {};
        Object.assign(u, payload);
        try { localStorage.setItem('user', JSON.stringify(u)); sessionStorage.setItem('user', JSON.stringify(u)); } catch (e) {}
        App.hideLoading(); App.toast('资料已保存'); App.closeSheet(); initMine();
      } catch (e) { App.hideLoading(); App.toast(e.message || '保存失败', 'error'); }
    }

    App.initPage({ active: 'mine', requireAuth: true, onReady: initMine });
  </script>
</body>
</html>
