<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>培训 · 游雁学院</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#667eea', secondary: '#764ba2' } } } };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/m/css/mobile.css">
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <!-- 顶部导航（与首页/课程页统一：Logo + 扫码） -->
    <header class="m-nav">
      <div class="m-nav__left"><span class="m-nav__title">游雁学院</span></div>
      <div class="m-nav__right">
        <button class="m-nav__pill" onclick="App.openSharePanel()" aria-label="更多">
          <i class="fa-solid fa-ellipsis"></i>
        </button>
        <button class="m-nav__pill" onclick="history.back()" aria-label="关闭">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </header>

    <!-- 课程表：干净白底日历 + 卡片列表（参考图风格） -->
    <section class="cs-section">
      <!-- 顶栏：左侧标题 + 右侧月份导航 -->
      <div class="cs-topbar">
        <h1 class="cs-page-title">课程表</h1>
        <div class="cs-cal-nav">
          <button class="cs-cal-nav__btn" onclick="shiftMonth(-1)" aria-label="上个月"><i class="fa-solid fa-chevron-left"></i></button>
          <span class="cs-cal-nav__label" id="cs-month-label">2026年7月</span>
          <button class="cs-cal-nav__btn" onclick="shiftMonth(1)" aria-label="下个月"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      </div>

      <!-- 完整月历（始终显示） -->
      <div class="cs-month-panel" id="m-month-panel">
        <!-- 图例 + 本月统计（参考钉钉考勤） -->
        <div class="cs-cal-meta">
          <div class="cs-stat" id="cs-stat">本月 0 场培训</div>
          <div class="cs-legend">
            <span class="cs-legend__i"><i class="dot dot--done"></i>已完成</span>
            <span class="cs-legend__i"><i class="dot dot--todo"></i>待完成</span>
            <span class="cs-legend__i"><i class="dot dot--upcoming"></i>未开始</span>
          </div>
        </div>
        <div class="m-month-view" id="m-month-view"></div>
      </div>
    </section>

    <!-- 列表头部（可选，当前由课程表统一承载） -->
    <div class="m-tl-hd" id="tl-hd" style="display:none">
      <span class="m-tl-hd__title" id="tl-title">本月培训</span>
      <span class="m-tl-hd__count" id="list-n">(0)</span>
    </div>

    <!-- 时间轴式日程列表 -->
    <section class="m-timeline" id="m-training-list">
      <div class="m-loading"><div class="m-spin"></div><div style="margin-left:10px">加载中...</div></div>
    </section>

    <!-- 底部：扫码签到 CTA（复用 scan.js 的 App.startScan） -->
    <section class="m-scan-cta">
      <button class="m-scan-cta__btn" onclick="App.startScan()" aria-label="扫码签到">
        <i class="fa-solid fa-qrcode"></i>
        <span>扫码签到</span>
      </button>
      <p class="m-scan-cta__tip">扫描培训现场的签到二维码，即可一键签到</p>
    </section>
  </div>

  <script src="/js/auth-modal.js?v=20260723m"></script>
  <script src="/m/js/api-client.js"></script>
  <script src="/m/js/common.js"></script>
  <script src="/m/js/scan.js"></script>
  <script>
    /* ========== 数据 ========== */
    var allTrainings = [];
    var signedDates = [];     // 已签到日期（day-of-month）
    var viewY, viewM;         // 当前查看的年月
    var selectedDate = null;  // 选中的日期（App.fmtDate 格式 'YYYY/M/D'），null=未选中

    /* ========== 工具函数 ========== */
    var AVATAR_COLORS = [
      'linear-gradient(135deg,#667eea,#764ba2)',
      'linear-gradient(135deg,#f093fb,#f5576c)',
      'linear-gradient(135deg,#4facfe,#00f2fe)',
      'linear-gradient(135deg,#43e97b,#38f9d7)',
      'linear-gradient(135deg,#fa709a,#fee140)'
    ];
    function avatarColor(idx) { return AVATAR_COLORS[idx % AVATAR_COLORS.length]; }

    /* ========== 月历渲染（可翻月、可点选日期联动列表） ========== */
    function renderMonthGrid(y, m) {
      var firstDay = (new Date(y, m, 1).getDay() + 6) % 7; // 周一为每周起点，与上方周日期条对齐
      var daysInMonth = new Date(y, m + 1, 0).getDate();
      var isCur = (viewY === y && viewM === m);
      var today = isCur ? new Date().getDate() : -1;
      var dw = ['一','二','三','四','五','六','日'];

      // 该月有培训的日期集合 + 每日聚合状态（参考钉钉考勤：绿=已完成 / 橙=待完成 / 蓝=未开始）
      var trainingDays = {};
      var dayStatus = {};
      allTrainings.forEach(function(t) {
        if (!t.startTime) return;
        var d = new Date(t.startTime);
        if (d.getFullYear() === y && d.getMonth() === m) {
          var day = d.getDate();
          trainingDays[day] = true;
          var st = calcStatus(t);
          var key = st ? st.cls : 'is-doing';
          // 优先级：todo > doing > upcoming > done（当天只要有未完成就标记为待完成）
          if (key === 'is-todo') dayStatus[day] = 'todo';
          else if (key === 'is-doing') { if (dayStatus[day] !== 'todo') dayStatus[day] = 'todo'; }
          else if (key === 'is-upcoming') { if (!dayStatus[day]) dayStatus[day] = 'upcoming'; }
          else if (key === 'is-done') { if (!dayStatus[day]) dayStatus[day] = 'done'; }
        }
      });

      var html = '<div class="m-mg-row">';
      dw.forEach(function(d) { html += '<div class="m-mg-dw">' + d + '</div>'; });
      html += '</div><div class="m-mg-row">';
      for (var i = 0; i < firstDay; i++) html += '<div class="m-mg-d is-empty"></div>';
      for (var d = 1; d <= daysInMonth; d++) {
        var dateKey = App.fmtDate(new Date(y, m, d));
        var cls = 'm-mg-d m-mg-d--click';
        if (d === today) cls += ' is-today';
        if (selectedDate && selectedDate === dateKey) cls += ' is-sel';
        else if (trainingDays[d]) cls += ' is-has';

        // 有培训时显示状态圆点（参考钉钉考勤的彩色圆点标识）
        var dotHtml = '';
        if (dayStatus[d]) {
          dotHtml = '<span class="m-mg-d__dot m-mg-d__dot--' + dayStatus[d] + '"></span>';
        }

        html += '<div class="' + cls + '" data-d="' + d + '">' + d + dotHtml + '</div>';
      }
      html += '</div>';
      var box = document.getElementById('m-month-view');
      box.innerHTML = html;
      box.querySelectorAll('.m-mg-d--click').forEach(function(el) {
        el.addEventListener('click', function() {
          var day = parseInt(el.getAttribute('data-d'), 10);
          var dateKey = App.fmtDate(new Date(y, m, day));
          var dayTrainings = allTrainings.filter(function(t) {
            if (!t.startTime) return false;
            return App.fmtDate(new Date(t.startTime)) === dateKey;
          });
          if (!dayTrainings.length) { App.toast('这一天没有培训安排'); return; }
          openDaySheet(dayTrainings);
        });
      });
    }

    // 头部统计（当前查看月的培训数 / 已签到数）+ 渲染月历
    function renderCalendar(y, m) {
      var monthCount = 0, monthSigned = 0;
      allTrainings.forEach(function(t) {
        if (!t.startTime) return;
        var d = new Date(t.startTime);
        if (d.getFullYear() === y && d.getMonth() === m) {
          monthCount++;
          if (t.signinDone) monthSigned++;
        }
      });
      var ml = document.getElementById('cs-month-label');
      if (ml) ml.textContent = y + '年' + (m + 1) + '月';
      var stat = document.getElementById('cs-stat');
      if (stat) stat.innerHTML = '本月 <b>' + monthCount + '</b> 场培训 · 已签到 <b>' + monthSigned + '</b> 场';
      renderMonthGrid(y, m);
    }

    // 翻月 / 回到今天
    function shiftMonth(delta) {
      var d = new Date(viewY, viewM + delta, 1);
      viewY = d.getFullYear(); viewM = d.getMonth();
      var box = document.getElementById('m-month-view');
      if (box) {
        box.classList.remove('is-slide-left', 'is-slide-right');
        void box.offsetWidth; // 强制 reflow，保证每次翻月动画都重放
        box.classList.add(delta < 0 ? 'is-slide-right' : 'is-slide-left');
      }
      renderCalendar(viewY, viewM);
      renderWeekStrip();
      renderFiltered();
    }
    function resetCalView() {
      selectedDate = null;
      var now = new Date();
      viewY = now.getFullYear(); viewM = now.getMonth();
      renderCalendar(viewY, viewM);
      renderWeekStrip();
      renderFiltered();
    }

    // 仅清除日期选中、保留当前筛选（用于列表区"查看全部"）
    function clearDateSel() {
      selectedDate = null;
      renderWeekStrip();
      renderMonthGrid(viewY, viewM);
      renderFiltered();
    }

    // 选中日期的友好标签（M月D日 + 周X）
    function fmtSelectedLabel() {
      if (!selectedDate) return null;
      var p = selectedDate.split('/');
      var dt = new Date(+p[0], +p[1] - 1, +p[2]);
      var wd = ['周日','周一','周二','周三','周四','周五','周六'][dt.getDay()];
      return { m: (+p[1]) + '月' + (+p[2]) + '日', w: wd };
    }

    /* ========== 两行日期网格（星期名行 + 日期数字行） ========== */
    function renderWeekStrip() {
      var grid = document.getElementById('cs-week-grid');
      if (!grid) return;
      var anchor = selectedDate ? new Date(selectedDate.replace(/\//g, '-')) : new Date();
      var day = anchor.getDay();
      var monOff = day === 0 ? -6 : 1 - day;
      var mon = new Date(anchor); mon.setDate(anchor.getDate() + monOff);
      var wdNames = ['周日','周一','周二','周三','周四','周五','周六'];
      var todayStr = App.fmtDate(new Date());
      var trainingDates = {};
      allTrainings.forEach(function(t) {
        if (!t.startTime) return;
        trainingDates[App.fmtDate(new Date(t.startTime))] = true;
      });

      // 第一行：星期名
      var wdHtml = '';
      for (var i = 0; i < 7; i++) {
        var d = new Date(mon); d.setDate(mon.getDate() + i);
        var isToday = (App.fmtDate(d) === todayStr);
        wdHtml += '<div class="cs-wd-cell' + (isToday ? ' is-today' : '') + '">' + wdNames[d.getDay()] + '</div>';
      }

      // 第二行：日期数字
      var dayHtml = '';
      for (var i = 0; i < 7; i++) {
        var d = new Date(mon); d.setDate(mon.getDate() + i);
        var key = App.fmtDate(d);
        var cls = 'cs-day-cell';
        if (key === todayStr) cls += ' is-today';
        if (selectedDate && selectedDate === key) cls += ' is-sel';
        else if (trainingDates[key]) cls += ' has-training';
        else if (signedDates.indexOf(d.getDate()) > -1) cls += ' is-done';
        dayHtml += '<div class="' + cls + '" data-date="' + key + '">' +
                    '<span class="cs-day-cell__num">' + d.getDate() + '</span>' +
                    '<span class="cs-day-cell__dot"></span>' +
                  '</div>';
      }

      grid.innerHTML = wdHtml + dayHtml;

      // 绑定点击（只绑第二行的日期格）
      grid.querySelectorAll('.cs-day-cell').forEach(function(el) {
        el.addEventListener('click', function() {
          var dt = el.getAttribute('data-date');
          selectedDate = (selectedDate === dt) ? null : dt;
          renderWeekStrip();
          renderFiltered();
        });
      });
    }

    function goToday() {
      selectedDate = null;
      var now = new Date();
      viewY = now.getFullYear(); viewM = now.getMonth();
      renderCalendar(viewY, viewM);
      renderWeekStrip();
      renderFiltered();
    }

    /* ========== 列表数据源（默认当月 / 选中某天） ========== */
    function getFiltered() {
      if (selectedDate) {
        return allTrainings.filter(function(t) {
          if (!t.startTime) return false;
          return App.fmtDate(new Date(t.startTime)) === selectedDate;
        });
      }
      var now = new Date();
      var y = now.getFullYear(), m = now.getMonth();
      return allTrainings.filter(function(t) {
        if (!t.startTime) return false;
        var d = new Date(t.startTime);
        return d.getFullYear() === y && d.getMonth() === m;
      });
    }

    function renderFiltered() {
      var list = getFiltered();
      document.getElementById('list-n').textContent = '(' + list.length + ')';
      var titleEl = document.getElementById('tl-title');
      if (selectedDate) {
        var lbl = fmtSelectedLabel();
        titleEl.textContent = lbl.m + ' 培训';
      } else {
        titleEl.textContent = '本月培训';
      }
      renderSchedList(list);
    }

    /* ========== 状态计算（已完成/进行中/待完成/未开始） ========== */
    function calcStatus(t) {
      var req = (t.signinEnabled ? 1 : 0) +
                (t.surveyEnabled && t.linkedSurveyId ? 1 : 0) +
                (t.examEnabled && t.linkedExamId ? 1 : 0);
      if (!req) return null;
      var done = (t.signinDone ? 1 : 0) + (t.surveyDone ? 1 : 0) + (t.examDone ? 1 : 0);
      if (done === req) return { cls: 'is-done', label: '已完成' };
      if (done > 0) return { cls: 'is-doing', label: '进行中' };
      var sd = t.startTime ? new Date(t.startTime) : null;
      var past = sd ? sd <= new Date() : true;
      return past ? { cls: 'is-todo', label: '待完成' } : { cls: 'is-upcoming', label: '未开始' };
    }

    /* ========== 课程卡片列表（参考图风格） ========== */
    function renderSchedList(list) {
      var box = document.getElementById('m-training-list');
      if (!list || !list.length) {
        var emptyText, guide = '';
        if (selectedDate) {
          var parts = selectedDate.split('/');
          emptyText = parts[1] + '月' + parts[2] + '日 没有培训安排';
          guide = '<div class="m-empty__acts"><button class="m-btn m-btn--ghost m-btn--sm" onclick="clearDateSel()">查看全部</button></div>';
        } else {
          emptyText = '本月还没有培训安排';
          guide = '<div class="m-empty__acts"><button class="m-btn m-btn--ghost m-btn--sm" onclick="goToday()">回到今日</button></div>';
        }
        box.innerHTML = '<div class="m-empty"><i class="fa-regular fa-calendar-xmark"></i>' + emptyText + guide + '</div>';
        return;
      }

      var sep = '';
      if (selectedDate) {
        var lbl = fmtSelectedLabel();
        sep = '<div class="m-date-sep">' +
                '<span class="m-date-sep__d">' + App.esc(lbl.m) + '</span>' +
                '<span class="m-date-sep__w">' + App.esc(lbl.w) + '</span>' +
                '<span class="m-date-sep__tip">当日培训</span>' +
                '<button class="m-date-sep__btn" onclick="clearDateSel()">查看全部</button>' +
              '</div>';
      }

      box.innerHTML = sep + list.map(function(t, idx) {
        var timeStr = t.startTime ? App.fmtHM(t.startTime) : (t.time || '');
        var endStr = t.endTime ? App.fmtHM(t.endTime) : '';

        // 课程标签（项目名或分类）
        var proj = t.projectName || t.project || t.category || '';
        var tagHtml = proj ? '<span class="cs-tag cs-tag--proj">' + App.esc(proj) + '</span>' : '';

        // 状态角标
        var st = calcStatus(t);
        var badgeHtml = st ? '<span class="cs-badge cs-badge--' + st.cls + '">' + App.esc(st.label) + '</span>' : '';

        // 讲师信息
        var instName = t.instructor || '待定';
        var instInitial = instName.charAt(0);

        // 副标题：时间范围 + 地点
        var timePart = timeStr + (endStr ? '–' + endStr : '');
        var subParts = [timePart];
        if (t.location) subParts.push(App.esc(t.location));
        var subTitle = subParts.join(' · ') || (t.category || '');

        // 操作按钮
        var acts = [];
        if (t.coursewareEnabled && t.coursewareFiles && t.coursewareFiles.length) {
          acts.push('<button class="cs-act" data-act="cw" onclick="event.stopPropagation();goDayTraining(' + t.id + ')"><i class="fa-regular fa-folder-open"></i><span>课件</span></button>');
        }
        if ((t.surveyEnabled && t.linkedSurveyId) || (t.examEnabled && t.linkedExamId)) {
          acts.push('<button class="cs-act" data-act="task" onclick="event.stopPropagation();goDayTraining(' + t.id + ')"><i class="fa-regular fa-file-lines"></i><span>作业</span></button>');
        }

        // 必修进度
        var req = (t.signinEnabled ? 1 : 0) + (t.surveyEnabled && t.linkedSurveyId ? 1 : 0) + (t.examEnabled && t.linkedExamId ? 1 : 0);
        var done = (t.signinDone ? 1 : 0) + (t.surveyDone ? 1 : 0) + (t.examDone ? 1 : 0);
        var progHtml = req ? '<div class="cs-prog"><span>必修</span><b>' + done + '/' + req + '</b></div>' : '';

        return '<div class="tl-item" data-id="' + t.id + '" style="--i:' + idx + '" onclick="goDayTraining(' + t.id + ')">' +
          '<div class="cs-card">' +
            /* 第一行：课程名（大字）+ 标签 + 状态角标 */
            '<div class="cs-card__row1">' +
              '<span class="cs-title">' + App.esc(t.name || '未命名培训') + '</span>' +
              tagHtml +
              badgeHtml +
            '</div>' +
            /* 第二行：讲师头像 + 名字 + 副标题 + 操作按钮 */
            '<div class="cs-card__row2">' +
              '<div class="cs-inst">' +
                '<span class="cs-avatar" style="background:' + avatarColor(idx) + '">' + App.esc(instInitial) + '</span>' +
                '<div class="cs-inst__info">' +
                  '<div class="cs-inst__name">' + App.esc(instName) + '</div>' +
                  '<div class="cs-inst__sub">' + subTitle + '</div>' +
                '</div>' +
              '</div>' +
              (acts.length ? '<div class="cs-actions">' + acts.join('') + '</div>' : '') +
            '</div>' +
            /* 第三行：必修进度 */
            progHtml +
          '</div>' +
        '</div>';
      }).join('');

      Array.prototype.forEach.call(box.querySelectorAll('.tl-item'), function(el) {
        el.addEventListener('click', function() { goDayTraining(el.getAttribute('data-id')); });
      });
    }

    /* ========== 数据获取（零冗余请求） ========== */
    async function getTraining(id) {
      var hit = allTrainings.find(function(x) { return String(x.id) === String(id); });
      if (hit) return hit;
      var ev = await Api.trainingDetail(id);
      return await enrichDetail(ev);
    }

    async function enrichDetail(ev) {
      var uid = App.userId();
      var t = {
        id: ev.id, name: ev.name, project: ev.project, instructor: ev.instructor,
        location: ev.location, content: ev.content,
        date: App.fmtDate(ev.startTime),
        time: (App.fmtHM(ev.startTime) + (ev.endTime ? ' - ' + App.fmtHM(ev.endTime) : '')),
        signinEnabled: ev.signinEnabled, signinStartTime: ev.signinStartTime, signinEndTime: ev.signinEndTime, signinId: ev.signinId, signinDone: false,
        surveyEnabled: ev.surveyEnabled, linkedSurveyId: ev.linkedSurveyId, surveyDone: false,
        examEnabled: ev.examEnabled, linkedExamId: ev.linkedExamId, examDone: false,
        coursewareEnabled: ev.coursewareEnabled, coursewareFiles: ev.coursewareFiles || [],
        startTime: ev.startTime, endTime: ev.endTime
      };
      if (uid) {
        try {
          var s = await Api.trainingSignins(t.id);
          var arr = (s && s.data) ? s.data : (Array.isArray(s) ? s : []);
          t.signinDone = arr.some(function(x) { return String(x.userId) == String(uid); });
        } catch(e) {}
        if (t.linkedSurveyId) {
          try { var c = await Api.surveyCheck(t.linkedSurveyId, uid, t.id); t.surveyDone = !!(c && c.responded); } catch(e) {}
        }
        if (t.linkedExamId) {
          try {
            var recs = await Api.examRecords() || [];
            t.examDone = recs.some(function(r) { return String(r.examId) == String(t.linkedExamId); });
          } catch(e) {}
        }
      }
      return t;
    }

    async function loadTrainings() {
      App.showLoading();
      try {
        var list = await Api.trainingSchedule() || [];
        allTrainings = Array.isArray(list) ? list : [];

        // 本地计算已签到日期（day-of-month），无需任何额外请求
        signedDates = allTrainings.filter(function(t) {
          return t.signinDone && t.startTime;
        }).map(function(t) {
          var d = new Date(t.startTime);
          return isNaN(d.getDate()) ? -1 : d.getDate();
        }).filter(function(n) { return n > 0; });

        var now = new Date();
        viewY = now.getFullYear(); viewM = now.getMonth();
        renderCalendar(viewY, viewM);
        renderWeekStrip();
        renderFiltered();

        var total = allTrainings.length;
        var signed = allTrainings.filter(function(t) { return t.signinDone; }).length;
        // 更新月份标签
        var ml = document.getElementById('cs-month-label');
        if (ml) ml.textContent = viewY + '年' + (viewM + 1) + '月';
      } catch(e) {
        document.getElementById('m-training-list').innerHTML =
          '<div class="m-empty"><i class="fa-regular fa-circle-xmark"></i>加载失败' +
          '<div class="m-empty__acts"><button class="m-btn m-btn--ghost m-btn--sm" onclick="reloadTraining()">重新加载</button></div></div>';
      } finally { App.hideLoading(); }
    }

    function reloadTraining() { loadTrainings(); }

    /* ========== 当日培训清单（点日历日格弹出，点项跳详情页） ========== */
    function openDaySheet(list) {
      var first = list[0];
      var dt = new Date(first.startTime);
      var parts = App.fmtDate(dt).split('/');
      var wd = ['周日','周一','周二','周三','周四','周五','周六'][dt.getDay()];
      var title = (+parts[1]) + '月' + (+parts[2]) + '日 · ' + wd;
      var rows = list.map(function(t) {
        var st = calcStatus(t);
        var badge = st ? '<span class="cs-badge cs-badge--' + st.cls + '">' + App.esc(st.label) + '</span>' : '';
        var timeStr = t.startTime ? App.fmtHM(t.startTime) : '';
        var endStr = t.endTime ? App.fmtHM(t.endTime) : '';
        return '<div class="cd-day-row" onclick="goDayTraining(' + t.id + ')">' +
          '<div class="cd-day-row__main">' +
            '<div class="cd-day-row__name">' + App.esc(t.name || '未命名培训') + '</div>' +
            '<div class="cd-day-row__meta">' + App.esc(timeStr + (endStr ? '–' + endStr : '')) + (t.location ? ' · ' + App.esc(t.location) : '') + '</div>' +
          '</div>' + badge + '<i class="cd-day-row__arrow fa-solid fa-chevron-right"></i></div>';
      }).join('');
      App.openSheet('<div class="m-sheet__hd"><div class="m-sheet__title">' + title + '</div></div><div class="m-sheet__body">' + rows + '</div>');
    }
    function goDayTraining(id) {
      App.closeSheet();
      location.href = '/m/course-detail.html?id=' + id;
    }

    /* ========== 培训详情弹层 ========== */
    function fmtSigninTime(start, end) {
      if (!start) return '';
      var s = App.fmtHM(start), e = end ? App.fmtHM(end) : '';
      return e ? ('签到时间 ' + s + ' - ' + e) : ('签到时间 ' + s);
    }

    function buildTasks(t) {
      var items = [];
      if (t.signinEnabled) items.push({ key:'signin', icon:'fa-circle-check', title:'考勤签到', tag:'必修', color:'#10b981', sub:fmtSigninTime(t.signinStartTime,t.signinEndTime), done:t.signinDone, act:'signin' });
      if (t.surveyEnabled && t.linkedSurveyId) items.push({ key:'survey', icon:'fa-chart-bar', title:'培训满意度调研', tag:'必修', color:'#0891b2', sub:'请根据本次培训真实感受填写', done:t.surveyDone, act:'survey' });
      if (t.examEnabled && t.linkedExamId) items.push({ key:'exam', icon:'fa-file-lines', title:'《' + t.name + '》培训考核', tag:'必修', color:'#d97706', sub:'完成考核以巩固学习成果', done:t.examDone, act:'exam' });
      if (t.coursewareEnabled && t.coursewareFiles && t.coursewareFiles.length) items.push({ key:'courseware', icon:'fa-folder-open', title:'培训课件（'+t.coursewareFiles.length+'个）', tag:'资料', color:'#7c3aed', sub:'培训相关资料，可自由下载', done:false, act:'courseware' });
      return items;
    }

    function renderTrainingSheet(t) {
      var tasks = buildTasks(t);
      var req = tasks.filter(function(x) { return x.tag === '必修'; }).length;
      var done = tasks.filter(function(x) { return x.done; }).length;
      var prog = req ? Math.round(done / req * 100) : 0;

      var taskHtml = tasks.length ? tasks.map(function(it) {
        var btn = it.done
          ? '<button class="m-task__btn m-task__btn--done" disabled>已完成</button>'
          : '<button class="m-task__btn m-task__btn--go" data-act="' + it.act + '">去完成</button>';
        return '<div class="m-task">' +
          '<div class="m-task__ic" style="background:' + it.color + '18;color:' + it.color + '"><i class="fa-solid ' + it.icon + '"></i></div>' +
          '<div class="m-task__main"><div class="m-task__title">' + App.esc(it.title) +
            ' <span class="m-task__tag" style="color:' + it.color + ';background:' + it.color + '18">' + it.tag + '</span></div>' +
            '<div class="m-task__sub">' + App.esc(it.sub) + '</div></div>' + btn + '</div>';
      }).join('') : '<p style="color:var(--ink-3);font-size:13px;text-align:center;padding:14px">暂无项目内容</p>';

      var html =
        '<div class="m-sheet__hd"><div class="m-sheet__title">培训详情</div></div>' +
        '<div class="m-sheet__body">' +
          '<h3 class="m-section__title" style="margin-bottom:8px"><i class="fa-solid fa-circle-info"></i>基本信息</h3>' +
          '<div class="m-card" style="margin-bottom:14px">' +
            '<div style="font-size:16px;font-weight:800;margin-bottom:8px">' + App.esc(t.name) + '</div>' +
            (t.content ? '<div style="font-size:13px;color:var(--ink-2);margin-bottom:10px;line-height:1.6">' + App.esc(t.content) + '</div>' : '') +
            '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12.5px;color:var(--ink-2)">' +
              '<div><i class="fa-regular fa-calendar" style="color:var(--brand-from)"></i> ' + App.esc(t.date || '') + '</div>' +
              '<div><i class="fa-regular fa-clock" style="color:var(--brand-from)"></i> ' + App.esc(t.time || '') + '</div>' +
              '<div><i class="fa-solid fa-user" style="color:var(--brand-from)"></i> ' + App.esc(t.instructor || '-') + '</div>' +
              '<div><i class="fa-solid fa-location-dot" style="color:var(--brand-from)"></i> ' + App.esc(t.location || '待定') + '</div>' +
            '</div>' +
          '</div>' +
          (tasks.length ? '<h3 class="m-section__title" style="margin-bottom:8px"><i class="fa-solid fa-list-check"></i>项目内容</h3>' : '') +
          taskHtml +
          (req ? '<div class="m-prog" style="margin-top:6px">培训进度 <b>' + done + '/' + req + '</b></div><div class="m-bar"><div class="m-bar__fill" style="width:' + prog + '%"></div></div>' : '') +
        '</div>';

      App.openSheet(html);
      var body = document.getElementById('m-sheet-body');
      body.setAttribute('data-training', JSON.stringify(t));
      body.querySelectorAll('[data-act]').forEach(function(btn) {
        btn.addEventListener('click', function() { handleTask(btn.getAttribute('data-act'), t); });
      });
    }

    async function openTraining(id) {
      App.showLoading();
      try {
        var t = await getTraining(id);
        App.hideLoading();
        renderTrainingSheet(t);
      } catch(e) {
        App.hideLoading();
        App.toast('培训信息加载失败', 'error');
      }
    }

    /* ========== 任务动作 ========== */
    async function handleTask(act, t) {
      if (act === 'signin') return doSignin(t);
      if (act === 'survey') return openSurvey(t.linkedSurveyId, t.id, t);
      if (act === 'exam') {
        var back = encodeURIComponent(location.pathname + location.search);
        location.href = '/exam.html?id=' + t.linkedExamId + '&returnUrl=' + back + '&trainingId=' + t.id;
        return;
      }
      if (act === 'courseware') return openCourseware(t.coursewareFiles);
    }

    function doSignin(t) {
      App.confirm({
        title: '考勤签到',
        message: '确认签到「' + t.name + '」？签到后将记录你的参训情况。',
        confirmText: '确认签到',
        onConfirm: function () { doSigninActual(t); }
      });
    }

    async function doSigninActual(t) {
      App.showLoading('签到中...');
      try {
        // 移动端扫码进入本页后自动携带签到码（signinId）完成校验
        await Api.signin(t.id, App.userId(), t.signinId);
        t.signinDone = true;
        var cached = allTrainings.find(function(x) { return String(x.id) === String(t.id); });
        if (cached) cached.signinDone = true;
        App.hideLoading();
        App.toast('签到成功');
        var d = t.startTime ? new Date(t.startTime) : null;
        if (d && !isNaN(d.getDate()) && signedDates.indexOf(d.getDate()) < 0) {
          signedDates.push(d.getDate());
        }
        renderCalendar(viewY, viewM);
        renderWeekStrip();
        renderFiltered();
        renderTrainingSheet(t);
      } catch(e) {
        App.hideLoading();
        App.toast(e.message || '签到失败', 'error');
      }
    }

    function openCourseware(files) {
      var html = '<div class="m-sheet__hd"><div class="m-sheet__title">培训课件</div></div><div class="m-sheet__body">' +
        files.map(function(f, i) {
          var name = (f.url || f).split('/').pop();
          return '<a class="m-row" href="' + App.esc(f.url || f) + '" download style="text-decoration:none">' +
            '<div class="m-row__ic"><i class="fa-solid fa-file-arrow-down"></i></div>' +
            '<div class="m-row__bd"><div class="m-row__t" style="font-size:13px">' + App.esc(name) + '</div></div>' +
            '<i class="m-row__arrow fa-solid fa-download"></i></a>';
        }).join('') + '</div>';
      App.openSheet(html);
    }

    /* ========== 调研 ========== */
    async function openSurvey(surveyId, trainingId, t) {
      App.showLoading();
      try {
        var survey = await Api.survey(surveyId);
        App.hideLoading();
        renderSurveySheet(survey, surveyId, trainingId, t);
      } catch(e) {
        App.hideLoading();
        App.toast('调研加载失败', 'error');
      }
    }

    function renderSurveySheet(survey, surveyId, trainingId, t) {
      var answers = {};
      var qs = survey.questions || [];
      var qHtml = qs.map(function(q, idx) {
        var reqMark = q.required ? '<span class="m-q__req">*</span>' : '';
        var inner = '';
        if (q.type === 'rating') {
          inner = '<div class="m-stars" data-q="' + q.id + '" data-type="rating">' +
            [1,2,3,4,5].map(function(n) { return '<i class="fa-solid fa-star" data-v="' + n + '"></i>'; }).join('') +
            '<span class="m-rate-val" id="rv-' + q.id + '"></span></div>';
        } else if (q.type === 'multiple') {
          inner = '<div data-q="' + q.id + '" data-type="multiple">' + (q.options || []).map(function(o) {
            return '<div class="m-opt" data-v="' + App.esc(o) + '"><i class="fa-regular fa-square"></i><span>' + App.esc(o) + '</span></div>';
          }).join('') + '</div>';
        } else if (q.type === 'judge') {
          inner = '<div data-q="' + q.id + '" data-type="single">' + ['正确','错误'].map(function(o) {
            return '<div class="m-opt" data-v="' + App.esc(o) + '"><i class="fa-regular fa-circle"></i><span>' + o + '</span></div>';
          }).join('') + '</div>';
        } else if (q.type === 'text') {
          inner = '<textarea class="m-input" data-q="' + q.id + '" data-type="text" rows="3" placeholder="请输入..."></textarea>';
        } else {
          inner = '<div data-q="' + q.id + '" data-type="single">' + (q.options || []).map(function(o) {
            return '<div class="m-opt" data-v="' + App.esc(o) + '"><i class="fa-regular fa-circle"></i><span>' + App.esc(o) + '</span></div>';
          }).join('') + '</div>';
        }
        return '<div class="m-q"><div class="m-q__t">' + (idx+1) + '. ' + App.esc(q.title) + reqMark + '</div>' + inner + '</div>';
      }).join('');

      var doneNote = t.surveyDone ? '<div class="m-badge m-badge--done" style="margin-bottom:12px;display:inline-block">您已填写过本调研</div>' : '';
      var html = '<div class="m-sheet__hd"><div class="m-sheet__title">' + App.esc(survey.title || '培训调研') + '</div></div>' +
        '<div class="m-sheet__body">' + doneNote +
          (survey.description ? '<p style="font-size:13px;color:var(--ink-2);margin-bottom:12px">' + App.esc(survey.description) + '</p>' : '') +
          qHtml +
          (t.surveyDone ? '' : '<button class="m-btn m-btn--block" id="survey-submit" style="margin-top:16px">提交调研</button>') +
        '</div>';
      App.openSheet(html);

      var body = document.getElementById('m-sheet-body');
      body.querySelectorAll('.m-stars').forEach(function(box) {
        var qid = box.getAttribute('data-q');
        box.querySelectorAll('i').forEach(function(star) {
          star.addEventListener('click', function() {
            var v = parseInt(star.getAttribute('data-v'));
            answers[qid] = v;
            box.querySelectorAll('i').forEach(function(s, i) { s.classList.toggle('is-on', i < v); });
            document.getElementById('rv-' + qid).textContent = v + ' 分';
          });
        });
      });
      body.querySelectorAll('[data-type="single"]').forEach(function(box) {
        var qid = box.getAttribute('data-q');
        box.querySelectorAll('.m-opt').forEach(function(opt) {
          opt.addEventListener('click', function() {
            box.querySelectorAll('.m-opt').forEach(function(o) { o.classList.remove('is-sel'); o.querySelector('i').className = 'fa-regular fa-circle'; });
            opt.classList.add('is-sel'); opt.querySelector('i').className = 'fa-solid fa-circle-dot';
            answers[qid] = opt.getAttribute('data-v');
          });
        });
      });
      body.querySelectorAll('[data-type="multiple"]').forEach(function(box) {
        var qid = box.getAttribute('data-q');
        answers[qid] = [];
        box.querySelectorAll('.m-opt').forEach(function(opt) {
          opt.addEventListener('click', function() {
            opt.classList.toggle('is-sel');
            var on = opt.classList.contains('is-sel');
            opt.querySelector('i').className = on ? 'fa-regular fa-square-check' : 'fa-regular fa-square';
            var v = opt.getAttribute('data-v'), arr = answers[qid];
            if (on) { if (arr.indexOf(v) < 0) arr.push(v); } else { answers[qid] = arr.filter(function(x) { return x !== v; }); }
          });
        });
      });
      body.querySelectorAll('[data-type="text"]').forEach(function(ta) {
        var qid = ta.getAttribute('data-q');
        ta.addEventListener('input', function() { answers[qid] = ta.value; });
      });

      var submit = document.getElementById('survey-submit');
      if (submit) submit.addEventListener('click', function() { submitSurvey(survey, surveyId, trainingId, t, answers); });
    }

    async function submitSurvey(survey, surveyId, trainingId, t, answers) {
      for (var i = 0; i < survey.questions.length; i++) {
        var q = survey.questions[i];
        if (!q.required) continue;
        var v = answers[q.id];
        if (q.type === 'multiple') { if (!v || !v.length) return App.toast('第' + (i+1) + '题为必填', 'error'); }
        else if (v === undefined || v === null || v === '') return App.toast('第' + (i+1) + '题为必填', 'error');
      }
      App.showLoading('提交中...');
      try {
        await Api.surveyRespond(surveyId, { userId: App.userId(), userName: App.userName(), trainingId: trainingId, answers: answers });
        t.surveyDone = true;
        var cached = allTrainings.find(function(x) { return String(x.id) === String(trainingId); });
        if (cached) cached.surveyDone = true;
        App.hideLoading(); App.toast('调研提交成功'); renderTrainingSheet(t);
      } catch(e) { App.hideLoading(); App.toast(e.message || '提交失败', 'error'); }
    }

    /* ========== 初始化 ========== */
    function onReady() {
      var id = new URLSearchParams(location.search).get('id');
      if (id) { location.href = '/m/course-detail.html?id=' + id; return; }
      loadTrainings();
    }
    App.initPage({ active: 'training', requireAuth: true, onReady: onReady });
  </script>
</body>
</html>
