<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>课程 · 游雁学院</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#667eea', secondary: '#764ba2' } } } };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/m/css/mobile.css">
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <!-- 顶部导航 -->
    <header class="m-nav" style="padding-bottom:10px">
      <div class="m-nav__left"><span class="m-nav__title">游雁学院</span></div>
    </header>

    <!-- 搜索框 -->
    <section style="margin:0 14px 12px">
      <div class="m-search">
        <i class="fa-solid fa-magnifying-glass m-search__ic"></i>
        <input class="m-search__input" id="m-search-input" placeholder="请输入要搜索的课程名称" autocomplete="off">
      </div>
    </section>

    <!-- 分类筛选悬浮按钮（点击打开弹层，置于右下角） -->
    <button type="button" class="m-filter-fab" id="m-filter-fab" onclick="openCategoryFilter()" aria-label="筛选分类">
      <i class="fa-solid fa-sliders"></i>
      <span class="m-filter-fab__badge" id="m-filter-fab-badge" title="清除筛选" onclick="event.stopPropagation();clearCategoryFilter()">
        <i class="fa-solid fa-xmark"></i>
      </span>
    </button>

    <!-- 全部课程标题 -->
    <div class="m-hd">
      <div class="m-hd__t">全部课程</div>
    </div>

    <!-- 课程两列卡片网格 -->
    <section style="padding:0 14px">
      <div id="m-course-grid" class="m-course-grid"><div class="m-loading"><div class="m-spin"></div><div style="margin-left:10px">加载中...</div></div></div>
    </section>
  </div>

  <script src="/js/auth-modal.js?v=20260723m"></script>
  <script src="/m/js/api-client.js"></script>
  <script src="/m/js/common.js"></script>
  <script src="/m/js/scan.js"></script>
  <script>
    // 封面加载失败时的占位图（同品牌紫渐变 + 播放图标），避免只留紫块导致"显示不全"
    var COVER_FALLBACK = "data:image/svg+xml;charset=utf-8," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='400' height='250'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#667eea'/><stop offset='1' stop-color='#764ba2'/></linearGradient></defs><rect width='400' height='250' fill='url(#g)'/><circle cx='200' cy='125' r='34' fill='rgba(255,255,255,0.92)'/><path d='M190 108 L222 125 L190 142 Z' fill='#667eea'/></svg>");

    var lecturerMap = {};
    var allCourses = [];
    var curCat = 'all';
    var expandedPrimary = null; // 当前展开显示二级分类的一级分类 id
    var searchQ = '';
    var catMap = {};  // id → {name, parentId, parentName}
    var catTree = []; // 完整分类树（父分类 + children），来自 /api/categories；失败则为空并触发回退

    /* ========== 搜索 & 筛选 ========== */
    function getFiltered() {
      var list = allCourses;
      if (curCat !== 'all' && curCat !== '__none__') {
        // 判断选中的是父分类还是子分类
        var info = catMap[curCat];
        if (info && !info.parentId) {
          // 一级分类：匹配自身及其所有二级子分类下的课程（同时看 categoryId 与 subcategoryId）
          var childIds = Object.keys(catMap).filter(function (k) { return String(catMap[k].parentId) === String(curCat); });
          list = list.filter(function (c) {
            var cid = String(c.categoryId || '');
            var sid = String(c.subcategoryId || '');
            return cid === curCat || sid === curCat || childIds.indexOf(cid) > -1 || childIds.indexOf(sid) > -1;
          });
        } else {
          // 二级分类或未知 ID：精确匹配 categoryId 或 subcategoryId
          list = list.filter(function (c) {
            return String(c.categoryId) === curCat || String(c.subcategoryId) === curCat;
          });
        }
      } else if (curCat === '__none__') {
        list = list.filter(function (c) { return !c.categoryId; });
      }
      if (searchQ) {
        var q = searchQ.toLowerCase();
        list = list.filter(function (c) { return (c.title || '').toLowerCase().indexOf(q) > -1; });
      }
      return list;
    }

    document.getElementById('m-search-input').addEventListener('input', function () {
      searchQ = this.value.trim();
      renderGrid(getFiltered());
    });

    /* ========== 数据加载 ========== */
    async function loadCategories() {
      try {
        var cats = await Api.categories() || [];
        catTree = Array.isArray(cats) ? cats : [];
        catMap = {};
        catTree.forEach(function (pc) {
          // 父分类
          catMap[String(pc.id)] = { name: pc.name, parentId: null, parentName: '', icon: pc.icon || '' };
          // 子分类
          (pc.children || []).forEach(function (sc) {
            catMap[String(sc.id)] = { name: sc.name, parentId: String(pc.id), parentName: pc.name };
          });
        });
      } catch (e) {
        // 接口失败时清空分类树，renderCats 自动回退到「从课程反推」
        catTree = [];
      }
    }

    async function loadCourses() {
      App.showLoading();
      try {
        await loadCategories();  // 先加载分类名
        var courses = await Api.courses() || [];
        var lecs = [];
        try { lecs = await Api.lecturers() || []; } catch (e) {}
        lecturerMap = {};
        lecs.forEach(function (l) { lecturerMap[l.id] = l; });
        allCourses = courses.filter(function (c) { return c.status === 'published' || c.status === undefined; });
        renderCats();
        renderGrid(allCourses);
      } catch (e) {
        document.getElementById('m-course-grid').innerHTML = '<div class="m-empty"><i class="fa-regular fa-circle-xmark"></i>加载失败</div>';
      } finally { App.hideLoading(); }
    }

    /* ========== 分类树 & 数量 ========== */
    // 取某父分类的子分类（优先分类树，回退时从课程反推）
    function childrenOf(pid) {
      var tree = (catTree && catTree.length) ? catTree : deriveTreeFromCourses();
      var p = tree.filter(function (x) { return String(x.id) === String(pid); })[0];
      return p ? (p.children || []) : [];
    }
    // 接口失败时的兜底：从课程反推「父→子」映射（不依赖 catMap，分类名缺失时降级为 id）
    function deriveTreeFromCourses() {
      var primaries = {};
      allCourses.forEach(function (c) {
        var cid = String(c.categoryId || '');
        var sid = String(c.subcategoryId || '');
        if (!cid) return;
        if (!primaries[cid]) {
          primaries[cid] = { id: cid, name: (catMap[cid] && catMap[cid].name) || ('分类' + cid), children: [] };
        }
        if (sid && !primaries[cid].children.some(function (x) { return String(x.id) === String(sid); })) {
          primaries[cid].children.push({ id: sid, name: (catMap[sid] && catMap[sid].name) || ('分类' + sid) });
        }
      });
      return Object.keys(primaries).map(function (k) { return primaries[k]; });
    }
    // 统计每个父/子分类的课程数（基于已发布课程 allCourses，不依赖 catMap，接口失败也准确）
    function computeCounts() {
      var counts = {};
      allCourses.forEach(function (c) {
        var cid = String(c.categoryId || '');
        var sid = String(c.subcategoryId || '');
        if (cid) counts[cid] = (counts[cid] || 0) + 1; // categoryId 即父分类
        if (sid) counts[sid] = (counts[sid] || 0) + 1; // subcategoryId 即子分类
      });
      return counts;
    }
    function countUncategorized() {
      return allCourses.filter(function (c) { return !c.categoryId; }).length;
    }
    // 单个筛选 chip（保留给可能的旧调用；当前主流程走筛选按钮弹层）
    function catChip(id, label, count, active, isPrimary) {
      var zeroCls = (count === 0) ? ' m-chip__cnt--zero' : '';
      return '<button class="m-chip' + (active ? ' is-active' : '') + '" data-cat="' + id + '"' +
        (isPrimary ? ' data-primary="1"' : '') + '>' +
        App.esc(label) + '<span class="m-chip__cnt' + zeroCls + '">' + count + '</span></button>';
    }

    function renderCats() {
      // 兼容旧调用：现在仅需刷新顶部筛选条
      updateFilterBar();
    }

    function catName(id) {
      var info = catMap[String(id)];
      return info ? info.name : ('分类' + id);
    }

    /* ========== 筛选按钮 + 弹层 ========== */
    // 取当前 curCat 的可读名（用于筛选条展示）
    function currentCategoryLabel() {
      if (curCat === 'all') return '全部分类';
      if (curCat === '__none__') return '未分类';
      var info = catMap[String(curCat)];
      if (info && info.parentId) {
        // 二级：显示「父 > 子」
        var pn = (catMap[info.parentId] && catMap[info.parentId].name) || info.parentName || '';
        return pn ? (pn + ' · ' + info.name) : info.name;
      }
      return info ? info.name : ('分类' + curCat);
    }

    function updateFilterBar() {
      var fab = document.getElementById('m-filter-fab');
      var badge = document.getElementById('m-filter-fab-badge');
      var active = (curCat !== 'all');
      if (fab) fab.classList.toggle('is-active', active);
      if (badge) badge.style.display = active ? 'inline-flex' : 'none';
    }

    function applyCategorySelection(cat) {
      curCat = cat;
      expandedPrimary = null;
      updateFilterBar();
      renderGrid(getFiltered());
    }

    function clearCategoryFilter() {
      applyCategorySelection('all');
      App.toast('已清除筛选');
    }

    // 渲染弹层中的可选项（统一 / 一级组 / 二级项）
    function renderCategorySheet() {
      var counts = computeCounts();
      var tree = (catTree && catTree.length) ? catTree : deriveTreeFromCourses();

      // 顶部：全部分类
      var html = '<div class="m-sheet__hd"><div class="m-sheet__title">选择分类</div></div>' +
        '<div class="m-sheet__body m-cat-sheet__body">' +
        '<div class="m-cat-tree">' +
          renderSheetItem('all', '全部分类', allCourses.length, curCat === 'all', null, false);

      // 每个一级分类：一组（标题 = 一级；下面是该下的子分类）
      tree.forEach(function (p) {
        var pid = String(p.id);
        var kids = p.children || [];
        var pActive = (curCat === pid);
        // 一级项：标题 + 右侧选中标记
        html += '<div class="m-cat-tree__group">' +
          renderSheetItem(pid, p.name, counts[pid] || 0, pActive, p.icon || '', true);
        if (kids.length) {
          html += '<div class="m-cat-tree__children">';
          kids.forEach(function (sc) {
            var sid = String(sc.id);
            html += renderSheetItem(sid, sc.name, counts[sid] || 0, curCat === sid, '', false);
          });
          html += '</div>';
        }
        html += '</div>';
      });

      // 未归类
      var unc = countUncategorized();
      if (unc) {
        html += '<div class="m-cat-tree__group">' +
          renderSheetItem('__none__', '未分类', unc, curCat === '__none__', '', true) +
        '</div>';
      }

      html += '</div></div>';
      return html;
    }

    function renderSheetItem(id, label, count, active, icon, isPrimary) {
      var zeroCls = (count === 0) ? ' m-cat-tree__cnt--zero' : '';
      var iconHtml = icon ? '<i class="fa-solid ' + App.esc(icon) + ' m-cat-tree__ic"></i>' : '<span class="m-cat-tree__ic"></span>';
      return '<button type="button" class="m-cat-tree__item' + (active ? ' is-active' : '') +
        (isPrimary ? ' is-primary' : '') + '" data-cat="' + App.esc(id) + '">' +
        iconHtml +
        '<span class="m-cat-tree__t">' + App.esc(label) + '</span>' +
        '<span class="m-cat-tree__cnt' + zeroCls + '">' + count + '</span>' +
        (active ? '<i class="fa-solid fa-check m-cat-tree__check"></i>' : '') +
      '</button>';
    }

    function openCategoryFilter() {
      var body = renderCategorySheet();
      App.openSheet(body);
      // 绑定弹层内点击：选中 → 关闭 + 筛选
      var sheetBody = document.getElementById('m-sheet-body');
      if (!sheetBody) return;
      Array.prototype.forEach.call(sheetBody.querySelectorAll('.m-cat-tree__item'), function (el) {
        el.addEventListener('click', function () {
          var cat = el.getAttribute('data-cat');
          App.closeSheet();
          // 微延迟，避免与 sheet 关闭动画抢焦点
          setTimeout(function () { applyCategorySelection(cat); }, 60);
        });
      });
    }

    /* ========== 两列卡片渲染（参考图风格） ========== */
    function starsHtml(rating) {
      var r = parseFloat(rating) || 0;
      var full = Math.floor(r / 2);
      var half = (r % 2 >= 1) ? 1 : 0;
      var empty = 5 - full - half;
      var s = '';
      for (var i = 0; i < full; i++) s += '<i class="fa-solid fa-star"></i>';
      if (half) s += '<i class="fa-solid fa-star-half-stroke"></i>';
      for (var j = 0; j < empty; j++) s += '<i class="fa-regular fa-star"></i>';
      return s;
    }

    function renderGrid(list) {
      var box = document.getElementById('m-course-grid');
      if (!list.length) {
        box.innerHTML = '<div class="m-empty" style="grid-column:1/-1;padding:40px 16px"><i class="fa-regular fa-folder-open"></i>暂无课程</div>';
        return;
      }
      box.innerHTML = list.map(function (c) {
        var lec = lecturerMap[c.lecturerId];
        var lecName = lec ? (lec.name || lec.realName || '平台讲师') : '平台讲师';
        var av = lec ? (lec.avatar || lec.photo || lec.cover || '') : '';
        var init = App.esc((lecName || '?').slice(0, 1));
        var avHtml = av
          ? '<img class="m-lec-mini" src="' + App.esc(av) + '" data-init="' + init + '" alt="' + App.esc(lecName) + '">'
          : '<span class="m-lec-mini">' + init + '</span>';
        var cover = c.cover || '';
        var rating = parseFloat(c.rating) || 0;
        var views = c.views || 0;
        var likes = c.likes || 0;

        return '<div class="m-ccard" data-id="' + c.id + '">' +
          '<div class="m-ccard__cover">' +
            (cover
              ? '<img class="m-cover-img" src="' + App.esc(cover) + '" alt="' + App.esc(c.title) + '" loading="lazy" onerror="this.src=\'' + COVER_FALLBACK + '\';this.onerror=null;">'
              : '<div class="m-ccard__cover-fallback"><i class="fa-solid fa-play-circle"></i></div>') +
            '<div class="m-ccard__play"><i class="fa-solid fa-play"></i></div>' +
          '</div>' +
          '<div class="m-ccard__bd">' +
            '<div class="m-ccard__t">' + App.esc(c.title) + '</div>' +
            '<div class="m-ccard__lec">' + avHtml + ' <span>' + App.esc(lecName) + '</span></div>' +
            '<div class="m-ccard__meta">' +
              '<div class="m-ccard__meta__left">' +
                '<span><i class="fa-regular fa-eye"></i> ' + views + '</span>' +
                '<span><i class="fa-regular fa-thumbs-up"></i> ' + likes + '</span>' +
              '</div>' +
              '<span class="m-ccard__meta__rating"><i class="fa-solid fa-star"></i> ' + rating.toFixed(1) + '</span>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');

      // 点击 → 直接播放
      Array.prototype.forEach.call(box.querySelectorAll('.m-ccard'), function (el) {
        el.addEventListener('click', function () {
          var id = el.getAttribute('data-id');
          var c = allCourses.find(function (x) { return String(x.id) === String(id); });
          if (c) playCourse(c);
        });
      });
      // 讲师头像加载失败 → 降级为首字母圆
      Array.prototype.forEach.call(box.querySelectorAll('img.m-lec-mini'), function (img) {
        img.addEventListener('error', function () {
          var d = document.createElement('span');
          d.className = 'm-lec-mini';
          d.textContent = img.getAttribute('data-init') || '?';
          img.parentNode.replaceChild(d, img);
        });
      });
    }

    /* ========== 直接播放课程 ========== */
    function playCourse(c) {
      var videos = c.videos || [];
      if (!videos.length) {
        App.toast('该课程暂无视频', 'error');
        return;
      }
      // 默认播放第一个视频（移动端专属播放器）
      var back = encodeURIComponent('m/course.html');
      location.href = '/m/player.html?id=' + c.id + '&index=0&returnUrl=' + back;
    }

    App.initPage({ active: 'course', requireAuth: true, onReady: loadCourses });
  </script>
</body>
</html>
