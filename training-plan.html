            document.getElementById('training-request-form').reset();
        }

        // 获取当前登录用户（统一字段处理）
        function getCurrentUser() {
            try {
                let user = null;
                
                // 优先使用 AuthGuard（如果页面已加载）
                if (typeof AuthGuard !== 'undefined' && AuthGuard.getCurrentUser) {
                    user = AuthGuard.getCurrentUser();
                } else {
                    // 备用：从 localStorage/sessionStorage 读取
                    const userStr = localStorage.getItem('user') || sessionStorage.getItem('user');
                    if (userStr) {
                        user = JSON.parse(userStr);
                    }
                }
                
                if (user) {
                    // 统一字段：确保 name 字段存在（兼容 real_name / realName / username）
                    user.name = user.name || 
                                (user.real_name && user.real_name.trim ? user.real_name.trim() : null) || 
                                (user.realName && user.realName.trim ? user.realName.trim() : null) || 
                                (user.username && user.username.trim ? user.username.trim() : null) || 
                                '未识别';
                    
                    // 统一部门字段
                    user.department = user.department || user.dept || '未识别';
                }
                
                return user;
            } catch (e) {
                console.error('获取用户信息失败:', e);
            }
            return null;
        }

        // 提交培训需求
        async function submitTrainingRequest(event) {
            event.preventDefault();
            
            const currentUser = getCurrentUser();
            if (!currentUser) {
                showToast('请先登录后再提交培训需求', 'error');
                return;
            }
            
            const submitBtn = event.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-1"></i>提交中...';

            // 收集表单数据
            const requestData = {
                id: 'req_' + Date.now(),
                submitterId: currentUser.id,
                submitterName: document.getElementById('req-name').value.trim() || currentUser.name,
                department: document.getElementById('req-department').value.trim() || currentUser.department,
                trainingType: document.getElementById('req-type').value,
                topic: document.getElementById('req-topic').value.trim(),
                targetAudience: document.getElementById('req-target').value.trim(),
                expectedTime: document.getElementById('req-time').value.trim(),
                description: document.getElementById('req-description').value.trim(),
                status: 'pending', // pending, approved, rejected, completed
                submitTime: new Date().toISOString(),
                updateTime: new Date().toISOString()
            };

            try {
                // 尝试发送到服务器
                const response = await fetch('/api/training-requests', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestData)
                });

                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        showToast('培训需求提交成功！我们会尽快处理您的申请。');
                        closeTrainingRequestModal();
                        return;
                    }
                }
            } catch (e) {
                console.log('服务器提交失败，保存到本地:', e.message);
            }

            // 离线模式：保存到 localStorage
            saveTrainingRequestLocally(requestData);
            showToast('培训需求已提交（本地保存）');
            closeTrainingRequestModal();
            
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalText;
        }

        // 本地保存培训需求
        function saveTrainingRequestLocally(requestData) {
            const storageKey = 'training_requests';
            let requests = JSON.parse(localStorage.getItem(storageKey) || '[]');
            requests.push(requestData);
            localStorage.setItem(storageKey, JSON.stringify(requests));
        }

        // ========== 培训进度功能 ==========
        
        // 加载培训进度（支持实时计算 - 按月统计）
        async function loadTrainingProgress() {
            const currentUser = getCurrentUser();
            if (!currentUser) return;

            try {
                const currentMonthStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                
                let monthlyEnrolled = 0;      // 本月已报名课程数
                let monthlyCompleted = 0;     // 本月已结束且已报名的课程数
                
                // 遍历本月课程，统计报名和完成情况
                courses.forEach(course => {
                    if (course.date && course.date.startsWith(currentMonthStr)) {
                        const enrollInfo = enrollMap[course.id];
                        const isEnrolled = enrollInfo && enrollInfo.isEnrolled;

                        if (isEnrolled) {
                            monthlyEnrolled++;
                            const courseDate = new Date(course.date);
                            const datePassed = !isNaN(courseDate.getTime()) && courseDate < today;
                            // 所有必修项目内容均完成也算已完成
                            const modulesDone =
                                (!course.signinEnabled || !!course.signinDone) &&
                                (!course.surveyEnabled || !!course.surveyDone) &&
                                (!course.examEnabled || !!course.examDone);
                            if (datePassed || modulesDone) {
                                monthlyCompleted++;
                            }
                        }
                    }
                });
                
                // 构建按月统计的数据结构
                const monthStats = {
                    completed: monthlyCompleted,   // 已结束且已报名
                    enrolled: monthlyEnrolled,     // 已报名总数
                    month: currentMonthStr
                };

                // 更新培训进度显示
                updateTrainingProgress(monthStats);
                
                console.log('[培训进度] 按月统计:', monthStats);
            } catch (e) {
                console.error('加载培训进度失败:', e);
            }
        }

        // 更新培训进度显示（按月统计）
        // 已完成培训 = 本月已结束且已报名的课程数 / 本月已报名课程数
        function updateTrainingProgress(monthStats) {
            const { completed, enrolled, month } = monthStats;

            // 更新已完成培训（本月已结束且已报名的 / 本月已报名的）
            const completedEl = document.getElementById('completed-training-count');
            const completedBar = document.getElementById('completed-training-bar');
            if (completedEl) {
                completedEl.textContent = `${completed}/${enrolled}`;
            }
            if (completedBar) {
                const percentage = enrolled > 0 ? (completed / enrolled * 100) : 0;
                completedBar.style.width = `${percentage}%`;
            }

            // 更新本月已报名
            const monthlyEl = document.getElementById('monthly-enrolled-count');
            if (monthlyEl) {
                monthlyEl.textContent = enrolled;
            }
            
            console.log('[培训进度] 更新显示:', { 
                month: month,
                completed: completed, 
                enrolled: enrolled
            });
        }

        // ========== 学习风采功能 ==========
        
        // 获取培训的学习风采
        function getTrainingGallery(trainingId) {
            const images = trainingGalleryMap[trainingId] || trainingGalleryMap[String(trainingId)];
            if (images && images.length > 0) {
                return { images };
            }
            // 兜底旧数据
            try {
                const all = JSON.parse(localStorage.getItem('training_gallery') || '{}');
                let data = all[trainingId];
                if (!data && typeof trainingId === 'number') data = all[String(trainingId)];
                if (!data && typeof trainingId === 'string') data = all[parseInt(trainingId)];
                return data || { images: [] };
            } catch (e) {
                console.error('[学习风采] 获取数据失败:', e);
                return { images: [] };
            }
        }

        // 显示提示消息
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed top-4 left-1/2 -translate-x-1/2 z-[200] px-6 py-3 rounded-full text-white text-sm font-medium shadow-lg transition-all duration-300 transform translate-y-[-100%] opacity-0 ${

            }`;

                <span class="flex items-center gap-2">
                    <i class="fa ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i>
                    ${message}
                </span>
            `;
            document.body.appendChild(toast);
            
            // 动画显示
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-[-100%]', 'opacity-0');
            });
            
            // 3秒后消失
            setTimeout(() => {

        // ========== 学习风采轮播功能 ==========
        
        let galleryCarouselData = []; // { trainingId, trainingName, images: [] }
        let galleryCarouselIndex = 0;
        let galleryCarouselInterval = null;
        let trainingGalleryMap = {}; // trainingId -> images[]，从服务端加载
        
        // 从服务端加载所有培训的学习风采（并兼容旧的 localStorage 数据）
        async function loadTrainingGalleries() {
            if (!courses || courses.length === 0) return;
            trainingGalleryMap = {};
            await Promise.all(courses.map(async (course) => {
                try {
                    const res = await fetch('/api/training/' + course.id + '/gallery');
                    const json = await res.json();
                    if (json.success && Array.isArray(json.images)) {
                        trainingGalleryMap[course.id] = json.images;
                    }
                } catch (e) {
                    console.error('[学习风采] 加载培训', course.id, '失败:', e);
                }
            }));

            // 兼容旧数据：服务端没有但 localStorage 有的，回退使用
            try {
                const localAll = JSON.parse(localStorage.getItem('training_gallery') || '{}');
                courses.forEach(course => {
                    const existing = trainingGalleryMap[course.id];
                    if (!existing || existing.length === 0) {
                        const localData = localAll[course.id] || localAll[String(course.id)];
                        if (localData && localData.images && localData.images.length) {
                            trainingGalleryMap[course.id] = localData.images;
                        }
                    }
                });
            } catch (e) {
                console.error('[学习风采] 读取本地备份失败:', e);
            }

            loadGalleryCarousel();
        }

        // 加载所有学习风采用于轮播
        function loadGalleryCarousel() {
            galleryCarouselData = [];

            Object.entries(trainingGalleryMap).forEach(([trainingId, images]) => {
                if (images && images.length > 0) {
                    const course = courses.find(c => c.id == trainingId);
                    galleryCarouselData.push({
                        trainingId,
                        trainingName: course ? course.name : ('培训 ' + trainingId),
                        images
                    });
                }
            });

            console.log('[学习风采轮播] 最终数据:', galleryCarouselData);
            renderGalleryCarousel();
        }
        
        // 渲染轮播
        function renderGalleryCarousel() {
            const emptyEl = document.getElementById('gallery-carousel-empty');
            const carouselEl = document.getElementById('gallery-carousel');
            const sectionEl = document.getElementById('main-gallery-section');

            if (!emptyEl || !carouselEl) return;

            if (galleryCarouselData.length === 0) {
                emptyEl.classList.remove('hidden');
                carouselEl.classList.add('hidden');
                if (sectionEl) sectionEl.classList.add('hidden');
                return;
            }

            if (sectionEl) sectionEl.classList.remove('hidden');
            emptyEl.classList.add('hidden');
            carouselEl.classList.remove('hidden');

            updateGalleryCarouselSlide();
            startGalleryCarouselAutoPlay();
        }
        
        // 更新当前幻灯片
        function updateGalleryCarouselSlide() {
            const item = galleryCarouselData[galleryCarouselIndex];
            const imgEl = document.getElementById('gallery-carousel-img');
            const titleEl = document.getElementById('gallery-carousel-title');
            const countEl = document.getElementById('gallery-carousel-count');
            const dotsEl = document.getElementById('gallery-carousel-dots');
            
            if (!item || !imgEl) return;
            
            // 随机显示该培训的一张图片
            const randomImg = item.images[Math.floor(Math.random() * item.images.length)];
            imgEl.src = randomImg;
            titleEl.textContent = item.trainingName;
            countEl.textContent = `共 ${item.images.length} 张照片`;
            
            // 更新指示器
            if (dotsEl) {
                dotsEl.innerHTML = galleryCarouselData.map((_, idx) => `
                    <button onclick="goToGalleryCarousel(${idx})" 
                            class="w-2 h-2 rounded-full transition ${idx === galleryCarouselIndex ? 'bg-indigo-500 w-4' : 'bg-gray-300'}"></button>
                `).join('');
            }
        }
        
        // 下一张
        function nextGalleryCarousel() {
            galleryCarouselIndex = (galleryCarouselIndex + 1) % galleryCarouselData.length;
            updateGalleryCarouselSlide();
            resetGalleryCarouselAutoPlay();
        }
        
        // 上一张
        function prevGalleryCarousel() {
            galleryCarouselIndex = (galleryCarouselIndex - 1 + galleryCarouselData.length) % galleryCarouselData.length;
            updateGalleryCarouselSlide();
            resetGalleryCarouselAutoPlay();
        }
        
        // 跳转到指定位置
        function goToGalleryCarousel(index) {
            galleryCarouselIndex = index;
            updateGalleryCarouselSlide();
            resetGalleryCarouselAutoPlay();
        }
        
        // 自动播放
        function startGalleryCarouselAutoPlay() {
            stopGalleryCarouselAutoPlay();
            galleryCarouselInterval = setInterval(() => {
                galleryCarouselIndex = (galleryCarouselIndex + 1) % galleryCarouselData.length;
                updateGalleryCarouselSlide();
            }, 5000);
        }
        
        function stopGalleryCarouselAutoPlay() {
            if (galleryCarouselInterval) {
                clearInterval(galleryCarouselInterval);
                galleryCarouselInterval = null;
            }
        }
        
        function resetGalleryCarouselAutoPlay() {
            stopGalleryCarouselAutoPlay();
            startGalleryCarouselAutoPlay();
        }
        
        // 打开轮播灯箱
        function openGalleryCarouselLightbox() {
            console.log('[学习风采轮播] 点击灯箱, galleryCarouselData:', galleryCarouselData, '当前索引:', galleryCarouselIndex);
            const item = galleryCarouselData[galleryCarouselIndex];
            if (!item) {
                console.log('[学习风采轮播] 无数据, 不打开灯箱');
                return;
            }
            console.log('[学习风采轮播] 打开灯箱, trainingId:', item.trainingId);
            openGalleryLightbox(item.trainingId, 0);
        }
        
        // 页面可见性变化时暂停/恢复轮播
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopGalleryCarouselAutoPlay();
            } else {
                startGalleryCarouselAutoPlay();
            }
        });
    </script>
</body>
</html>
